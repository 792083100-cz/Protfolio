<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFlicker · Chat — 折叠侧栏 + 空白面板</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="../../components.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-sm-font-family);
      font-size: var(--body-sm-font-size);
      line-height: var(--body-sm-line-height);
      font-weight: var(--body-sm-font-weight);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── icon (CSS mask) ── */
    .icon {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 16px; height: 16px;
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      background-color: currentColor;
    }
    .icon--20 { width: 20px; height: 20px; }
    .icon--14 { width: 14px; height: 14px; }
    .icon--16 { width: 16px; height: 16px; }

    .i-newchat      { -webkit-mask-image: url(../../assets/icons/kid/edit.svg);              mask-image: url(../../assets/icons/kid/edit.svg); }
    .i-search       { -webkit-mask-image: url(../../assets/icons/kid/search.svg);            mask-image: url(../../assets/icons/kid/search.svg); }
    .i-schedule     { -webkit-mask-image: url(../../assets/icons/kid/scheduledtasks.svg);     mask-image: url(../../assets/icons/kid/scheduledtasks.svg); }
    .i-skill        { -webkit-mask-image: url(../../assets/icons/kid/skill.svg);             mask-image: url(../../assets/icons/kid/skill.svg); }
    .i-knowledge    { -webkit-mask-image: url(../../assets/icons/kid/knowledge.svg);         mask-image: url(../../assets/icons/kid/knowledge.svg); }
    .i-leftsidebar  { -webkit-mask-image: url(../../assets/icons/kid/leftsidebar.svg);       mask-image: url(../../assets/icons/kid/leftsidebar.svg); }
    .i-rightsidebar { -webkit-mask-image: url(../../assets/icons/kid/rightsidebar.svg);      mask-image: url(../../assets/icons/kid/rightsidebar.svg); }
    .i-unfold       { -webkit-mask-image: url(../../assets/icons/kid/myflicker_system_unfold.svg); mask-image: url(../../assets/icons/kid/myflicker_system_unfold.svg); }
    .i-arrowdown    { -webkit-mask-image: url(../../assets/icons/kid/arrowdown.svg);         mask-image: url(../../assets/icons/kid/arrowdown.svg); }
    .i-add          { -webkit-mask-image: url(../../assets/icons/kid/add.svg);               mask-image: url(../../assets/icons/kid/add.svg); }
    .i-more         { -webkit-mask-image: url(../../assets/icons/kid/more.svg);              mask-image: url(../../assets/icons/kid/more.svg); }
    .i-setting      { -webkit-mask-image: url(../../assets/icons/kid/setting.svg);           mask-image: url(../../assets/icons/kid/setting.svg); }
    .i-send         { -webkit-mask-image: url(../../assets/icons/kid/send.svg);              mask-image: url(../../assets/icons/kid/send.svg); }
    .i-inspiration  { -webkit-mask-image: url(../../assets/icons/kid/inspiration.svg);       mask-image: url(../../assets/icons/kid/inspiration.svg); }
    .i-share        { -webkit-mask-image: url(../../assets/icons/kid/share02.svg);           mask-image: url(../../assets/icons/kid/share02.svg); }
    .i-copy         { -webkit-mask-image: url(../../assets/icons/kid/copy.svg);              mask-image: url(../../assets/icons/kid/copy.svg); }
    .i-assets       { -webkit-mask-image: url(../../assets/icons/kid/assets.svg);            mask-image: url(../../assets/icons/kid/assets.svg); }
    .i-enlarge      { -webkit-mask-image: url(../../assets/icons/kid/enlarge.svg);           mask-image: url(../../assets/icons/kid/enlarge.svg); }
    .i-generationcompleted { -webkit-mask-image: url(../../assets/icons/kid/generationcompleted.svg); mask-image: url(../../assets/icons/kid/generationcompleted.svg); }
    .i-plug         { -webkit-mask-image: url(../../assets/icons/kid/plug.svg);              mask-image: url(../../assets/icons/kid/plug.svg); }
    .i-layers       { -webkit-mask-image: url(../../assets/icons/kid/layers.svg);            mask-image: url(../../assets/icons/kid/layers.svg); }
    .i-data         { -webkit-mask-image: url(../../assets/icons/kid/data.svg);              mask-image: url(../../assets/icons/kid/data.svg); }
    .i-check        { -webkit-mask-image: url(../../assets/icons/kid/check.svg);             mask-image: url(../../assets/icons/kid/check.svg); }
    .i-adjustment   { -webkit-mask-image: url(../../assets/icons/kid/adjustment.svg);        mask-image: url(../../assets/icons/kid/adjustment.svg); }
    .i-jumppage     { -webkit-mask-image: url(../../assets/icons/kid/jumppage.svg);          mask-image: url(../../assets/icons/kid/jumppage.svg); }
    .i-closure      { -webkit-mask-image: url(../../assets/icons/kid/closure.svg);           mask-image: url(../../assets/icons/kid/closure.svg); }
    .i-ppt          { -webkit-mask-image: url(../../assets/icons/kid/ppt.svg);               mask-image: url(../../assets/icons/kid/ppt.svg); }
    .i-earth        { -webkit-mask-image: url(../../assets/icons/kid/earth.svg);             mask-image: url(../../assets/icons/kid/earth.svg); }
    .i-picture      { -webkit-mask-image: url(../../assets/icons/kid/picture.svg);           mask-image: url(../../assets/icons/kid/picture.svg); }
    /* ── App Shell ── */
    .app-shell {
      display: flex;
      height: 100vh; width: 100%;
      background: var(--bg-brand-subtle);
      gap: 4px;
    }

    /* ── icon-btn ── */
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      border-radius: var(--radius-4); border: none; background: transparent;
      cursor: pointer; color: var(--text-tertiary);
      transition: background 120ms, color 120ms; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--fill-default); color: var(--text-default); }
    .icon-btn--28 { width: 28px; height: 28px; border-radius: var(--radius-8); }

    /* ── chat + resizer + panel 共用容器 ── */
    .chat-panel-group {
      flex: 1; min-width: 0;
      display: flex;
      margin: 8px 8px 8px 0;
      height: calc(100vh - 16px);
      border-radius: 8px;
      overflow: hidden;
    }

    /* ════════════════════════════════════════
       SIDEBAR — 收起 / 浮层 / 固定 三态
       收起态完全隐藏侧栏（不再保留 56px Rail 列）；
       hover 顶栏「展开」呼出浮层任务栏，click 才固定左侧栏。
    ════════════════════════════════════════ */
    .app-shell { position: relative; }
    .mf-aside { transition: width 180ms ease; }

    /* 收起态：侧栏移出文档流并隐藏 */
    .is-aside-collapsed .mf-aside { display: none; }
    /* 收起态：对话面板补左边距，与右侧对称 */
    .is-aside-collapsed .chat-panel-group { margin-left: 8px; }

    /* 浮层态：悬浮在对话面板之上，快捷切换任务 */
    .is-aside-collapsed .mf-aside.is-floating {
      display: flex;
      position: absolute;
      top: 8px; left: 8px;
      height: calc(100vh - 16px);
      width: 240px;
      z-index: 300;
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-12);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--text-default) 14%, transparent);
    }

    /* 顶栏前导按钮组：仅收起态展示（展开 / 搜索 / 新对话） */
    .chat-topbar__lead { display: none; align-items: center; gap: 4px; margin-right: 4px; }
    .is-aside-collapsed .chat-topbar__lead { display: flex; }

    /* ════════════════════════════════════════
       MAIN AREA — chat-main
    ════════════════════════════════════════ */
    .chat-main {
      flex: 1; display: flex; flex-direction: column;
      min-width: 360px;
      background: var(--bg-base-default);
      overflow: hidden;
    }

    /* ── Topbar ── */
    .chat-topbar {
      height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; gap: var(--spacer-8);
    }
    .chat-topbar__title {
      font-size: var(--body-sm-font-size);
      font-weight: 500;
      color: var(--text-default);
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-topbar__right { display: flex; align-items: center; gap: 4px; }

    /* topbar 操作：纯图标，统一二级文字色 */
    .topbar-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      border: none; border-radius: var(--radius-4);
      background: transparent; cursor: pointer;
      color: var(--text-secondary);
      transition: background 120ms;
    }
    .topbar-btn:hover { background: var(--fill-default); }
    .topbar-btn.is-active { color: var(--text-secondary); }
    .topbar-btn.is-active .icon { background-color: var(--text-secondary); }

    /* ── Message Area ── */
    .chat-messages {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
      padding: 24px 24px 0;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border-neutral-l1); border-radius: 2px; }

    .message-list-body-column {
      max-width: 680px; width: 100%;
      margin: 0 auto;
      display: flex; flex-direction: column;
    }

    /* ── Single message ── */
    .msg { display: flex; gap: 12px; align-items: flex-start; padding: 16px 0; }
    .msg--user { flex-direction: row-reverse; }
    .msg__bubble { display: flex; flex-direction: column; gap: 4px; max-width: 520px; }
    .msg--user .msg__bubble { align-items: flex-end; }

    .msg__text {
      background: var(--bg-base-secondary);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-12);
      padding: 12px 16px;
      font-size: var(--body-sm-font-size); line-height: 1.6;
      color: var(--text-default);
    }
    .msg--user .msg__text {
      background: var(--bg-brand-subtle); border-color: var(--bg-brand-subtle); color: var(--text-default);
      border-radius: var(--radius-12) var(--radius-4) var(--radius-12) var(--radius-12);
    }
    .msg--ai .msg__text { background: transparent; border: none; padding: 0; border-radius: 0; }

    .msg__body { font-size: 13px; line-height: 1.5; color: var(--text-default); }
    .msg__body p { margin-top: 3px; }
    .msg__body p:first-child { margin-top: 0; }

    .msg__footer {
      display: flex; align-items: center;
      margin-top: 6px;
      opacity: 0; transition: opacity 120ms;
    }
    .msg:hover .msg__footer { opacity: 1; }

    /* ── Chat input area ── */
    .chat-input-wrap { flex-shrink: 0; padding: 12px 24px 8px; }
    .chat-input-inner { max-width: 680px; margin: 0 auto; }

    .mf-chat-input { padding: 12px !important; }
    .mf-chat-input__textarea { max-height: 336px !important; overflow-y: hidden; resize: none; }
    .mf-chat-input__textarea.is-overflow { overflow-y: auto; }
    .mf-chat-input__model-arrow { width: 16px !important; height: 16px !important; flex: 0 0 16px !important; }

    /* 窄对话区适配：工具栏不溢出 */
    .mf-chat-input__toolbar { gap: 4px; }
    .mf-chat-input__toolbar-left { flex: 1; min-width: 0; overflow: hidden; }
    .mf-chat-input__toolbar-left > * { flex-shrink: 0; }
    .mf-chat-input__toolbar-right { flex-shrink: 0; }
    /* 窄态：非首要操作项降级为纯图标（JS 按可用宽度切换） */
    .mf-chat-input__toolbar-left.is-compact .mf-chat-input__action--collapsible {
      width: 28px; padding: 0; justify-content: center;
    }
    .mf-chat-input__toolbar-left.is-compact .mf-chat-input__action--collapsible span:not(.icon) {
      display: none;
    }
    /* 极窄态：可折叠操作项整体隐藏，收进「+」菜单 */
    .mf-chat-input__toolbar-left.is-tight .mf-chat-input__action--collapsible { display: none; }

    /* 「+」菜单：复用 .mf-menu，fixed 定位避免被输入框祖先 overflow 裁切 */
    .plus-entry { position: relative; flex: 0 0 auto; }
    .plus-menu { display: none; position: fixed; z-index: 200; }
    .plus-entry.is-open .plus-menu { display: block; }
    .plus-menu .mf-menu { min-width: 200px; }
    /* 折叠项（技能/灵感触发）默认藏在菜单里，仅极窄态展示 */
    .plus-menu__folded { display: none; }
    .mf-menu__item.plus-menu__folded.is-shown { display: flex; }
    .mf-menu__divider.plus-menu__folded.is-shown { display: block; }
    /* ════════════════════════════════════════
       SIDE PANEL — 空白容器（待填充）
    ════════════════════════════════════════ */
    /* ════════════════════════════════════════
       PLUGIN CLUSTER — 输入框内的「插件」入口
    ════════════════════════════════════════ */
    .plugin-entry { position: relative; flex: 0 0 auto; }

    /* 插件入口：常驻展示近期高频 top3，方形头像负 margin 堆叠，hover 整体底色 */
    .plugin-cluster {
      position: relative;
      display: inline-flex; align-items: center;
      height: 28px; padding: 0 var(--spacer-4);
      border: none; border-radius: var(--radius-8);
      background: transparent; cursor: pointer;
      transition: background 120ms;
    }
    .plugin-cluster:hover,
    .plugin-cluster.is-open { background: var(--bg-overlay-l1); }
    .plugin-cluster__avatars { display: inline-flex; align-items: center; }
    .plugin-cluster__avatar {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--text-default);
      border: 1px solid var(--border-neutral-subtle);
      border-radius: var(--radius-6);
      background: var(--bg-base-default);
    }
    .plugin-cluster__avatar + .plugin-cluster__avatar { margin-left: -6px; }
    .plugin-cluster__avatar .icon { width: 14px; height: 14px; }

    /* 基础组件 tooltip：复用 .mf-tooltip 气泡，CSS hover 触发 */
    .plugin-cluster__tip {
      position: absolute;
      bottom: calc(100% + var(--spacer-8));
      left: 50%; transform: translateX(-50%);
      white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 120ms;
      z-index: 60;
      box-shadow: none;
    }
    .plugin-cluster:hover .plugin-cluster__tip { opacity: 1; }
    .plugin-entry.is-open .plugin-cluster__tip { opacity: 0; }

    /* 插件选择面板：复用 .mf-model-picker，fixed 定位避免被输入框祖先 overflow 裁切 */
    .plugin-menu {
      display: none;
      position: fixed;
      z-index: 200;
    }
    .plugin-entry.is-open .plugin-menu { display: block; }
    .plugin-menu .mf-model-picker { width: 240px; }
    .plugin-menu .mf-model-picker__item:not(.is-selected) .mf-model-picker__check { display: none; }
    .plugin-menu .mf-model-picker__add-arrow .icon { width: 16px; height: 16px; }

    /* ════════════════════════════════════════
       SIDE PANEL — 由选中插件决定内容形态
    ════════════════════════════════════════ */
    .panel-resizer {
      width: 4px;
      flex-shrink: 0;
      cursor: col-resize;
      background: var(--bg-base-default);
      border-left: 1px solid var(--border-neutral-l1);
      transition: border-color 150ms, background 150ms;
      z-index: 10;
      box-sizing: border-box;
    }
    .panel-resizer:hover,
    .panel-resizer.is-dragging {
      border-left-color: transparent;
      background: var(--border-neutral-l2);
    }

    .side-panel {
      width: 560px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-base-default);
      height: 100%;
      overflow: hidden;
    }

    /* 面板内容区：形态由选中插件决定 */
    .side-panel__body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-base-default);
    }

    /* 面板头：当前插件形态标识 */
    .side-panel__head {
      height: 40px; flex-shrink: 0;
      display: none; align-items: center; gap: var(--spacer-8);
      padding: 0 var(--spacer-8) 0 12px;
      border-bottom: 1px solid var(--border-neutral-l1);
    }
    .side-panel.has-plugin .side-panel__head { display: flex; }
    .side-panel__head-title {
      flex: 1; min-width: 0;
      font-size: var(--body-sm-font-size);
      font-weight: 500;
      color: var(--text-default);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* 各形态视图：默认隐藏，由 data-view 激活 */
    .panel-view { display: none; flex: 1; overflow: hidden; }
    .panel-view.is-active { display: flex; }

    /* 形态一：自由画布 */
    .panel-view--canvas {
      background-color: var(--bg-base-secondary);
      background-image:
        radial-gradient(circle, var(--border-neutral-l1) 1px, transparent 1px);
      background-size: 16px 16px;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .canvas-node {
      width: 160px;
      padding: 12px 14px;
      background: var(--bg-base-default);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-8);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--text-default) 6%, transparent);
      display: flex; flex-direction: column; gap: var(--spacer-4);
    }
    .canvas-node__title { font-size: var(--body-sm-font-size); font-weight: 500; }
    .canvas-node__desc { font-size: var(--body-xs-font-size); color: var(--text-tertiary); }

    /* 形态二：数据看板 */
    .panel-view--board {
      flex-direction: column;
      overflow-y: auto;
      padding: var(--spacer-16);
      gap: var(--spacer-12);
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--spacer-12);
    }
    .board-card {
      padding: 14px 16px;
      background: var(--bg-base-secondary);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-8);
      display: flex; flex-direction: column; gap: var(--spacer-4);
    }
    .board-card__label { font-size: var(--body-xs-font-size); color: var(--text-tertiary); }
    .board-card__value { font-size: 20px; font-weight: 600; color: var(--text-default); }

    /* 形态零：空态（未选插件） */
    .panel-view--empty {
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: var(--spacer-8);
      color: var(--text-tertiary);
    }
    .panel-view--empty .icon { width: 24px; height: 24px; }

    :root {
      --spacer-6: 6px; --spacer-10: 10px;
      --spacer-16: 16px; --spacer-20: 20px;
      --radius-16: 16px;
    }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- ════════════════════════════════════════
       SIDEBAR — .mf-aside（默认折叠 Rail 态）
  ════════════════════════════════════════ -->
  <aside class="mf-aside" id="asideNav">

    <div class="mf-aside__header">
      <div class="mf-aside__workspace">
        <img class="mf-aside__workspace-avatar" src="../../assets/icons/workspace-myflicker.svg" alt="workspace" />
        <span class="mf-aside__workspace-name">Coci team space</span>
        <span class="icon i-unfold mf-aside__workspace-unfold"></span>
      </div>
      <button class="mf-aside__collapse" aria-label="收起侧边栏" title="收起侧边栏" onclick="toggleAsideCollapse()">
        <span class="icon i-leftsidebar"></span>
      </button>
    </div>

    <nav class="mf-aside__nav">
      <div class="mf-aside__nav-item is-active" title="新对话">
        <span class="icon i-newchat"></span>
        <span class="mf-aside__nav-item__label">新对话</span>
      </div>
      <div class="mf-aside__nav-item" title="搜索">
        <span class="icon i-search"></span>
        <span class="mf-aside__nav-item__label">搜索</span>
      </div>
      <div class="mf-aside__nav-item" title="定时任务">
        <span class="icon i-schedule"></span>
        <span class="mf-aside__nav-item__label">定时任务</span>
      </div>
      <div class="mf-aside__nav-item" title="技能">
        <span class="icon i-skill"></span>
        <span class="mf-aside__nav-item__label">技能</span>
      </div>
      <div class="mf-aside__nav-item" title="知识">
        <span class="icon i-knowledge"></span>
        <span class="mf-aside__nav-item__label">知识</span>
      </div>
    </nav>

    <div class="mf-aside__body">

      <div class="mf-aside__section-label is-always-show">
        <span>分组</span>
        <div class="mf-aside__section-label-actions">
          <button class="mf-aside__icon-btn" aria-label="新建分组">
            <span class="icon i-add"></span>
          </button>
        </div>
      </div>

      <div class="mf-aside__section-label">
        <span>对话</span>
        <div class="mf-aside__section-label-actions">
          <button class="mf-aside__icon-btn" aria-label="新建对话"><span class="icon i-add"></span></button>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:4px;">
        <div class="mf-aside__session is-active">
          <span class="mf-aside__session-status">
            <span class="icon i-generationcompleted" style="color:var(--text-secondary);"></span>
          </span>
          <span class="mf-aside__session-title">构建 MyFlicker 世界</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">今天</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
        <div class="mf-aside__session">
          <span class="mf-aside__session-status"></span>

  </aside><!-- /mf-aside -->

  <!-- ════════════════════════════════════════
       MAIN AREA — 对话态（窄）+ 右侧空白面板
  ════════════════════════════════════════ -->
  <div class="chat-panel-group">

    <main class="chat-main">

      <div class="chat-topbar">
        <div class="chat-topbar__lead">
          <button class="topbar-btn" aria-label="展开侧边栏" title="展开侧边栏" id="btnExpandAside">
            <span class="icon icon--16 i-leftsidebar"></span>
          </button>
          <button class="topbar-btn" aria-label="搜索" title="搜索">
            <span class="icon icon--16 i-search"></span>
          </button>
          <button class="topbar-btn" aria-label="新对话" title="新对话">
            <span class="icon icon--16 i-newchat"></span>
          </button>
        </div>
        <span class="chat-topbar__title">构建 MyFlicker 世界</span>
        <div class="chat-topbar__right">
          <button class="topbar-btn" aria-label="分享" title="分享">
            <span class="icon icon--16 i-share"></span>
          </button>
          <button class="topbar-btn is-active" aria-label="面板" title="面板" id="btnTogglePanel">
            <span class="icon icon--16 i-assets"></span>
          </button>

      </div>

      <!-- 消息列表 -->
      <div class="chat-messages">
        <div class="message-list-body-column">

          <div class="msg msg--user">
            <div class="msg__bubble">
              <div class="msg__text">用户消息占位文案</div>
            </div>
          </div>

          <div class="msg msg--ai">
            <div class="msg__bubble" style="max-width:560px;width:100%;">
              <div class="msg__text">
                <div class="msg__body">
                  <p>AI 回复占位文案。</p>
                </div>
              </div>
              <div class="msg__footer">
                <button class="icon-btn icon-btn--28" aria-label="复制">
                  <span class="icon i-copy"></span>
                </button>
                <button class="icon-btn icon-btn--28" aria-label="分享">
                  <span class="icon i-share"></span>
                </button>

          </div>

        </div>
      </div>

      <!-- 底部输入框 -->
      <div class="chat-input-wrap">
        <div class="chat-input-inner">
          <div class="mf-chat-input-wrap">
            <div class="mf-chat-input">
              <textarea class="mf-chat-input__textarea" rows="1" placeholder="你的 Flicker，随时待命"></textarea>
              <div class="mf-chat-input__toolbar">
                <div class="mf-chat-input__toolbar-left">
                  <div class="plus-entry" id="plusEntry">
                    <button class="mf-chat-input__btn" aria-label="添加" onclick="togglePlusMenu(event)">
                      <span class="icon i-add"></span>
                    </button>
                    <div class="plus-menu" id="plusMenu">
                      <div class="mf-menu">
                        <button class="mf-menu__item"><span class="icon i-assets mf-menu__icon"></span>添加本地文件</button>
                        <button class="mf-menu__item"><span class="icon i-layers mf-menu__icon"></span>添加云盘文件</button>
                        <button class="mf-menu__item"><span class="icon i-schedule mf-menu__icon"></span>定时任务</button>
                        <div class="mf-menu__divider plus-menu__folded" id="plusFoldedDivider"></div>
                        <button class="mf-menu__item plus-menu__folded" id="plusFoldedSkill"><span class="icon i-skill mf-menu__icon"></span>技能</button>
                        <button class="mf-menu__item plus-menu__folded" id="plusFoldedInspire"><span class="icon i-inspiration mf-menu__icon"></span>灵感触发</button>
                      </div>
                    </div>

                  <button class="mf-chat-input__action mf-chat-input__action--collapsible">

                  <button class="mf-chat-input__action mf-chat-input__action--collapsible">
                    <span class="icon i-inspiration"></span>
                    <span>灵感触发</span>

                  <!-- 插件入口：图标簇 + 选择面板 -->
                  <div class="plugin-entry" id="pluginEntry">
                    <button class="plugin-cluster" id="pluginCluster" onclick="togglePluginMenu(event)">
                      <span class="plugin-cluster__avatars" id="pluginClusterAvatars"></span>
                      <span class="plugin-cluster__tip mf-tooltip">连接插件</span>
                    </button>

                    <div class="plugin-menu" id="pluginMenu">
                      <div class="mf-model-picker">

                        </button>
                        <button class="mf-model-picker__add">
                          <span style="display:inline-flex;align-items:center;gap:var(--spacer-8);"><span class="mf-model-picker__icon"><span class="icon i-jumppage"></span></span>添加插件</span>

                <div class="mf-chat-input__toolbar-right">

    </main>

    <!-- 拖拽把手 -->
    <div class="panel-resizer" id="panelResizer" title="拖拽调整宽度"></div>

    <!-- ════════════════════════════════════════
         SIDE PANEL — 空白容器（下一轮填充内容）
    ════════════════════════════════════════ -->
    <div class="side-panel" id="sidePanel">
      <div class="side-panel__head">
        <span class="side-panel__head-title" id="panelTitle"></span>
        <button class="icon-btn" aria-label="关闭插件" title="关闭插件" onclick="selectPlugin(null)">
          <span class="icon i-closure"></span>
        </button>
      </div>
      <div class="side-panel__body">

        <!-- 形态零：未选插件 -->
        <div class="panel-view panel-view--empty is-active" data-view="empty">
          <span class="icon i-plug"></span>
          <span>选择插件后在此展示对应形态</span>
        </div>

        <!-- 形态一：自由画布 -->
        <div class="panel-view panel-view--canvas" data-view="canvas">
          <div class="canvas-node">
            <span class="canvas-node__title">节点名称</span>
            <span class="canvas-node__desc">节点描述占位</span>
          </div>

        <!-- 形态二：数据看板 -->
        <div class="panel-view panel-view--board" data-view="board">
          <div class="board-grid">
            <div class="board-card">
              <span class="board-card__label">指标名称</span>
              <span class="board-card__value">1,234</span>
            </div>
            <div class="board-card">
              <span class="board-card__label">指标名称</span>
              <span class="board-card__value">56.7%</span>
            </div>
            <div class="board-card">
              <span class="board-card__label">指标名称</span>
              <span class="board-card__value">890</span>
            </div>
            <div class="board-card">
              <span class="board-card__label">指标名称</span>
              <span class="board-card__value">12.3</span>
            </div>
          </div>
        </div>

      </div>

  </div><!-- /chat-panel-group -->

</div><!-- /app-shell -->

<script>
  /* textarea auto-resize */
  document.querySelectorAll('.mf-chat-input__textarea').forEach(function(ta) {
    function resize() {
      ta.style.height = 'auto';
      var next = Math.min(ta.scrollHeight, 336);
      ta.style.height = next + 'px';
      ta.classList.toggle('is-overflow', ta.scrollHeight > 336);
    }
    ta.addEventListener('input', resize);
    resize();
  });

  /* ── 侧栏三态：收起 / 浮层 / 固定 ──
     收起后侧栏完全隐藏，「展开/搜索/新对话」常驻对话面板左上角；
     hover 顶栏「展开」呼出浮层任务栏，click 才固定左侧栏。 */
  var shell = document.querySelector('.app-shell');
  var aside = document.getElementById('asideNav');
  var btnExpand = document.getElementById('btnExpandAside');
  var floatTimer = null;

  function collapseAside() {
    shell.classList.add('is-aside-collapsed');
    aside.classList.remove('is-floating');
  }
  /* 头部按钮：浮层态点它固定侧栏，展开态点它收起 */
  function toggleAsideCollapse() {
    if (shell.classList.contains('is-aside-collapsed')) pinAside();
    else collapseAside();
  }
  function pinAside() {
    shell.classList.remove('is-aside-collapsed');
    aside.classList.remove('is-floating');
  }
  function showFloating() {
    if (!shell.classList.contains('is-aside-collapsed')) return;
    clearTimeout(floatTimer);
    aside.classList.add('is-floating');
  }
  function hideFloatingSoon() {
    floatTimer = setTimeout(function() { aside.classList.remove('is-floating'); }, 160);
  }

  btnExpand.addEventListener('mouseenter', showFloating);
  btnExpand.addEventListener('mouseleave', hideFloatingSoon);
  btnExpand.addEventListener('click', pinAside);
  aside.addEventListener('mouseenter', function() { clearTimeout(floatTimer); });
  aside.addEventListener('mouseleave', function() {
    if (shell.classList.contains('is-aside-collapsed')) hideFloatingSoon();
  });

  /* ── 插件：入口常驻展示近期高频 top3，选中插件决定右侧面板形态 ── */
  var PLUGINS = {
    canvas: { name: '自由画布', icon: 'i-layers', view: 'canvas', clicks: 128 },
    board:  { name: '数据看板', icon: 'i-data',   view: 'board',  clicks: 96 },
    ppt:    { name: '幻灯片',   icon: 'i-ppt',    view: 'empty',  clicks: 73 },
    web:    { name: '联网搜索', icon: 'i-earth',  view: 'empty',  clicks: 41 },
    image:  { name: '图像生成', icon: 'i-picture',view: 'empty',  clicks: 12 }
  };
  var activePlugins = [];

  /* 按近期点击频次取 top3 的插件 key */
  function topPlugins(n) {
    return Object.keys(PLUGINS)
      .sort(function(a, b) { return PLUGINS[b].clicks - PLUGINS[a].clicks; })
      .slice(0, n);
  }

  function togglePluginMenu(e) {
    e.stopPropagation();
    var entry = document.getElementById('pluginEntry');
    var opening = !entry.classList.contains('is-open');
    entry.classList.toggle('is-open');
    document.getElementById('pluginCluster').classList.toggle('is-open');
    if (opening) positionPluginMenu();
  }

  /* fixed 面板锚定到按钮上方左对齐 */
  function positionPluginMenu() {
    var btn  = document.getElementById('pluginCluster');
    var menu = document.getElementById('pluginMenu');
    var r = btn.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top  = '';
    menu.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  }

  function closePluginMenu() {
    document.getElementById('pluginEntry').classList.remove('is-open');
    document.getElementById('pluginCluster').classList.remove('is-open');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#pluginEntry')) closePluginMenu();
  });

  /* 选择插件（传 null 表示清空）；记一次点击以驱动高频排序 */
  function selectPlugin(key) {
    if (key) PLUGINS[key].clicks++;
    activePlugins = key ? [key] : [];
    syncPluginCluster();
    syncPanelView();
    closePluginMenu();
  }

  /* 入口常驻展示近期高频 top3 插件图标簇 */
  function syncPluginCluster() {
    var avatars = document.getElementById('pluginClusterAvatars');
    avatars.innerHTML = topPlugins(3).map(function(k) {
      var active = activePlugins.indexOf(k) > -1 ? ' is-selected' : '';
      return '<span class="plugin-cluster__avatar' + active + '" title="' + PLUGINS[k].name +
             '"><span class="icon ' + PLUGINS[k].icon + '"></span></span>';
    }).join('');
    renderPluginMenu();
  }

  /* 选择面板：列出全部插件（按高频排序），标记选中态 */
  function renderPluginMenu() {
    var list = document.getElementById('pluginMenuList');
    list.innerHTML = Object.keys(PLUGINS)
      .sort(function(a, b) { return PLUGINS[b].clicks - PLUGINS[a].clicks; })
      .map(function(k) {
        var sel = activePlugins.indexOf(k) > -1 ? ' is-selected' : '';
        return '<li class="mf-model-picker__item' + sel + '" data-plugin="' + k +
          '" onclick="selectPlugin(\'' + k + '\')">' +
          '<span class="mf-model-picker__icon"><span class="icon ' + PLUGINS[k].icon + '"></span></span>' +
          '<span class="mf-model-picker__name">' + PLUGINS[k].name + '</span>' +
          '<span class="mf-model-picker__spacer"></span>' +
          '<span class="mf-model-picker__check"><span class="icon i-check"></span></span></li>';
      }).join('');
  }

  /* 同步右侧面板形态 */
  function syncPanelView() {
    var panel = document.getElementById('sidePanel');
    var key   = activePlugins[0];
    var view  = key ? PLUGINS[key].view : 'empty';

    panel.classList.toggle('has-plugin', !!key);
    document.getElementById('panelTitle').textContent = key ? PLUGINS[key].name : '';

    document.querySelectorAll('.panel-view').forEach(function(v) {
      v.classList.toggle('is-active', v.dataset.view === view);
    });
  }

  syncPluginCluster();

  /* 输入框工具栏两级适配：
     一级（is-compact）技能/灵感触发降级为纯图标；
     二级（is-tight）图标也放不下时整体隐藏，收进「+」菜单。 */
  (function() {
    var toolbar = document.querySelector('.mf-chat-input__toolbar');
    var left    = toolbar.querySelector('.mf-chat-input__toolbar-left');
    var right   = toolbar.querySelector('.mf-chat-input__toolbar-right');
    var folded  = document.querySelectorAll('.plus-menu__folded');

    function need() {
      return Array.prototype.reduce.call(left.children, function(sum, el) {
        return el.offsetParent === null ? sum : sum + el.offsetWidth;
      }, 0) + (left.children.length - 1) * 4;
    }
    function fits() { return need() <= toolbar.clientWidth - right.offsetWidth - 8; }

    function sync() {
      left.classList.remove('is-compact', 'is-tight');
      folded.forEach(function(el) { el.classList.remove('is-shown'); });
      if (fits()) return;
      /* 一级：纯图标 */
      left.classList.add('is-compact');
      if (fits()) return;
      /* 二级：收进「+」菜单 */
      left.classList.add('is-tight');
      folded.forEach(function(el) { el.classList.add('is-shown'); });
    }
    new ResizeObserver(sync).observe(toolbar);
    sync();
  })();

  /* 「+」菜单：fixed 定位到按钮上方左对齐 */
  function togglePlusMenu(e) {
    e.stopPropagation();
    var entry = document.getElementById('plusEntry');
    var opening = !entry.classList.contains('is-open');
    entry.classList.toggle('is-open');
    if (opening) positionPlusMenu();
  }
  function positionPlusMenu() {
    var btn  = document.querySelector('#plusEntry .mf-chat-input__btn');
    var menu = document.getElementById('plusMenu');
    var r = btn.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  }
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#plusEntry')) document.getElementById('plusEntry').classList.remove('is-open');
  });

  /* toggle side panel */
  function togglePanel() {
    var panel   = document.getElementById('sidePanel');
    var resizer = document.getElementById('panelResizer');
    var btn     = document.getElementById('btnTogglePanel');
    var open    = panel.style.display === 'none';
    panel.style.display   = open ? 'flex' : 'none';
    resizer.style.display = open ? '' : 'none';
    btn.classList.toggle('is-active', open);
  }
  document.getElementById('btnTogglePanel').addEventListener('click', togglePanel);

  /* panel resize */
  (function() {
    var resizer = document.getElementById('panelResizer');
    var panel   = document.getElementById('sidePanel');
    var group   = document.querySelector('.chat-panel-group');
    var MIN_W = 280, MAX_W = 900;
    var CHAT_MIN_W = 360;

    resizer.addEventListener('mousedown', function(e) {
      var startX = e.clientX;
      var startW = panel.offsetWidth;
      resizer.classList.add('is-dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';

      function onMove(e) {
        var delta = startX - e.clientX;
        /* 上限同时受 MAX_W 与「对话区不小于 360px」约束 */
        var maxByChat = group.clientWidth - resizer.offsetWidth - CHAT_MIN_W;
        var upper = Math.min(MAX_W, maxByChat);
        panel.style.width = Math.min(upper, Math.max(MIN_W, startW + delta)) + 'px';
      }
      function onUp() {
        resizer.classList.remove('is-dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  })();
</script>

</body>
