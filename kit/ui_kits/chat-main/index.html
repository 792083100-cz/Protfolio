<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFlicker · Chat</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="../../components.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-sm-font-family);
      font-size: var(--body-sm-font-size);
      line-height: var(--body-sm-line-height);
      font-weight: var(--body-sm-font-weight);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── icon (CSS mask — 继承 currentColor) ── */
    .icon {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 16px; height: 16px;
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      background-color: currentColor;
    }
    .icon--20 { width: 20px; height: 20px; }
    .icon--16 { width: 16px; height: 16px; }
    .icon--14 { width: 14px; height: 14px; }
    .icon--12 { width: 12px; height: 12px; }

    /* kid icon instances — 路径相对于 ui_kits/chat-main/ */
    .i-newchat            { -webkit-mask-image: url(../../assets/icons/kid/edit.svg);              mask-image: url(../../assets/icons/kid/edit.svg); }
    .i-search             { -webkit-mask-image: url(../../assets/icons/kid/search.svg);             mask-image: url(../../assets/icons/kid/search.svg); }
    .i-schedule           { -webkit-mask-image: url(../../assets/icons/kid/scheduledtasks.svg);     mask-image: url(../../assets/icons/kid/scheduledtasks.svg); }
    .i-skill              { -webkit-mask-image: url(../../assets/icons/kid/skill.svg);              mask-image: url(../../assets/icons/kid/skill.svg); }
    .i-knowledge          { -webkit-mask-image: url(../../assets/icons/kid/knowledge.svg);          mask-image: url(../../assets/icons/kid/knowledge.svg); }
    .i-closefolder        { -webkit-mask-image: url(../../assets/icons/kid/closefolder.svg);        mask-image: url(../../assets/icons/kid/closefolder.svg); }
    .i-openfolder         { -webkit-mask-image: url(../../assets/icons/kid/openfolder.svg);         mask-image: url(../../assets/icons/kid/openfolder.svg); }
    .i-leftsidebar        { -webkit-mask-image: url(../../assets/icons/kid/leftsidebar.svg);        mask-image: url(../../assets/icons/kid/leftsidebar.svg); }
    .i-unfold { -webkit-mask-image: url(../../assets/icons/kid/myflicker_system_unfold.svg); mask-image: url(../../assets/icons/kid/myflicker_system_unfold.svg); }
    .i-arrowdown          { -webkit-mask-image: url(../../assets/icons/kid/arrowdown.svg);          mask-image: url(../../assets/icons/kid/arrowdown.svg); }
    .i-add                { -webkit-mask-image: url(../../assets/icons/kid/add.svg);                mask-image: url(../../assets/icons/kid/add.svg); }
    .i-addgroup           { -webkit-mask-image: url(../../assets/icons/kid/addgroup.svg);           mask-image: url(../../assets/icons/kid/addgroup.svg); }
    .i-more               { -webkit-mask-image: url(../../assets/icons/kid/more.svg);               mask-image: url(../../assets/icons/kid/more.svg); }
    .i-setting            { -webkit-mask-image: url(../../assets/icons/kid/setting.svg);            mask-image: url(../../assets/icons/kid/setting.svg); }
    .i-points             { -webkit-mask-image: url(../../assets/icons/kid/points.svg);             mask-image: url(../../assets/icons/kid/points.svg); }
    .i-generating         { -webkit-mask-image: url(../../assets/icons/kid/generating.svg);         mask-image: url(../../assets/icons/kid/generating.svg); }
    .i-error2             { -webkit-mask-image: url(../../assets/icons/kid/error2.svg);             mask-image: url(../../assets/icons/kid/error2.svg); }
    .i-draft              { -webkit-mask-image: url(../../assets/icons/kid/draft.svg);              mask-image: url(../../assets/icons/kid/draft.svg); }
    .i-pintotop           { -webkit-mask-image: url(../../assets/icons/kid/pintotop.svg);           mask-image: url(../../assets/icons/kid/pintotop.svg); }
    .i-generationcompleted{ -webkit-mask-image: url(../../assets/icons/kid/generationcompleted.svg);mask-image: url(../../assets/icons/kid/generationcompleted.svg); }
    .i-share              { -webkit-mask-image: url(../../assets/icons/kid/share.svg);              mask-image: url(../../assets/icons/kid/share.svg); }
    .i-copy               { -webkit-mask-image: url(../../assets/icons/kid/copy.svg);               mask-image: url(../../assets/icons/kid/copy.svg); }
    .i-like               { -webkit-mask-image: url(../../assets/icons/kid/ask.svg);                mask-image: url(../../assets/icons/kid/ask.svg); }
    .i-send               { -webkit-mask-image: url(../../assets/icons/kid/send.svg);               mask-image: url(../../assets/icons/kid/send.svg); }
    .i-flash              { -webkit-mask-image: url(../../assets/icons/kid/flash.svg);              mask-image: url(../../assets/icons/kid/flash.svg); }
    .i-attach             { -webkit-mask-image: url(../../assets/icons/kid/addfiles.svg);           mask-image: url(../../assets/icons/kid/addfiles.svg); }
    .i-inspiration        { -webkit-mask-image: url(../../assets/icons/kid/inspiration.svg);        mask-image: url(../../assets/icons/kid/inspiration.svg); }
    .i-closure            { -webkit-mask-image: url(../../assets/icons/kid/closure.svg);             mask-image: url(../../assets/icons/kid/closure.svg); }
    .i-pdf                { -webkit-mask-image: url(../../assets/icons/kid/pdf.svg);                 mask-image: url(../../assets/icons/kid/pdf.svg); }
    .i-txt2               { -webkit-mask-image: url(../../assets/icons/kid/txt2.svg);                mask-image: url(../../assets/icons/kid/txt2.svg); }
    .i-word               { -webkit-mask-image: url(../../assets/icons/kid/word.svg);                mask-image: url(../../assets/icons/kid/word.svg); }

    /* ── App Shell ── */
    .app-shell {
      display: flex;
      height: 100vh;
      width: 100%;
      background: var(--bg-brand-subtle);
      gap: 4px;
    }

    /* ── icon-btn（页面内通用小图标按钮，非 aside 内部）── */
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      border-radius: var(--radius-4); border: none; background: transparent;
      cursor: pointer; color: var(--text-tertiary);
      transition: background 120ms, color 120ms; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--fill-default); color: var(--text-default); }
    .icon-btn--28 { width: 28px; height: 28px; border-radius: var(--radius-8); }

    /* ════════════════════════════════════════
       MAIN AREA
    ════════════════════════════════════════ */
    .chat-main {
      flex: 1; display: flex; flex-direction: column;
      min-width: 0;
      background: var(--bg-base-default);
      border-radius: 8px; overflow: hidden;
      margin: 8px 8px 8px 0;
      height: calc(100vh - 16px);
    }

    .chat-topbar {
      height: 52px; flex-shrink: 0;
      border-bottom: 1px solid var(--border-neutral-l1);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--spacer-24); gap: var(--spacer-12);
    }
    .chat-topbar__left  { display: flex; align-items: center; gap: var(--spacer-8); }
    .chat-topbar__title { font-size: var(--heading-sm-font-size); font-weight: var(--heading-sm-font-weight); }
    .chat-topbar__right { display: flex; align-items: center; gap: var(--spacer-8); }

    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: var(--spacer-24) var(--spacer-24) var(--spacer-16);
      display: flex; flex-direction: column; gap: var(--spacer-24);
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border-neutral-l1); border-radius: 2px; }

    .chat-content-width { max-width: 760px; width: 100%; margin: 0 auto; }

    /* ── Welcome screen ── */
    .chat-welcome-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 var(--spacer-24) var(--spacer-20);
      overflow: hidden;
    }
    .chat-welcome__headline {
      display: flex; align-items: center; gap: 12px;
      user-select: none;
    }
    .chat-welcome__headline img {
      height: 48px; width: auto; display: block;
    }

    /* 对话框区域 */
    .chat-input-wrap { flex-shrink: 0; padding: 0 var(--spacer-24) var(--spacer-20); }

    .msg { display: flex; gap: var(--spacer-12); align-items: flex-start; }
    .msg--user { flex-direction: row-reverse; }
    .msg__avatar { flex-shrink: 0; margin-top: 2px; }
    .msg__bubble { display: flex; flex-direction: column; gap: var(--spacer-4); max-width: 560px; }
    .msg--user .msg__bubble { align-items: flex-end; }
    .msg__name { font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); color: var(--text-tertiary); font-weight: 500; }
    .msg__text {
      background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-12); padding: var(--spacer-12) var(--spacer-16);
      font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); color: var(--text-default);
    }
    .msg--user .msg__text {
      background: var(--bg-brand); border-color: var(--bg-brand); color: var(--text-onbrand);
      border-radius: var(--radius-12) var(--radius-4) var(--radius-12) var(--radius-12);
    }
    .msg--ai .msg__text { border-radius: var(--radius-4) var(--radius-12) var(--radius-12) var(--radius-12); }
    .msg__text p + p { margin-top: var(--spacer-8); }
    .msg__text code {
      background: var(--bg-overlay-l1); border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-4); padding: 1px 5px;
      font-family: var(--code-editor-font-family); font-size: 12px; color: var(--text-secondary);
    }
    .msg__actions { display: flex; gap: var(--spacer-4); margin-top: var(--spacer-4); opacity: 0; transition: opacity 120ms; }
    .msg:hover .msg__actions { opacity: 1; }

    .msg__thinking {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 2px 0;
      background: transparent; border: none;
      font-size: var(--body-sm-font-size);
    }
    .thinking-mascot {
      width: 24px; height: 24px; flex-shrink: 0;
      object-fit: contain;
      animation: mascot-float 2.4s ease-in-out infinite;
    }
    @keyframes mascot-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-3px); }
    }
    .thinking-label {
      background: linear-gradient(
        90deg,
        var(--text-tertiary) 0%,
        var(--text-tertiary) 30%,
        var(--text-default) 50%,
        var(--text-tertiary) 70%,
        var(--text-tertiary) 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer-scan 2s linear infinite;
    }
    @keyframes shimmer-scan {
      0%   { background-position: 150% center; }
      100% { background-position: -50% center; }
    }

    .suggestions { display: flex; gap: var(--spacer-8); flex-wrap: wrap; padding: 0 var(--spacer-24) var(--spacer-16); }
    .suggestions-inner { max-width: 760px; width: 100%; margin: 0 auto; display: flex; gap: var(--spacer-8); flex-wrap: wrap; }

    .chat-input-inner { max-width: 760px; margin: 0 auto; }
    .chat-input-inner--welcome { max-width: 800px; width: 100%; margin-top: 40px; }

    :root {
      --spacer-6: 6px; --spacer-10: 10px;
      --spacer-16: 16px; --spacer-20: 20px;
      --radius-16: 16px;
    }

    /* ── mf-chat-input 业务组件规范覆盖 v1.2.0 ── */
    .mf-chat-input { padding: 12px !important; }
    .mf-chat-input__textarea { max-height: 336px !important; overflow-y: hidden; resize: none; }
    .mf-chat-input__textarea.is-overflow { overflow-y: auto; }
    .mf-chat-input__model-arrow { width: 16px !important; height: 16px !important; flex: 0 0 16px !important; }


  </style>
</head>
<body>

<div class="app-shell">

  <!-- ════════════════════════════════════════
       SIDEBAR — .mf-aside 业务组件
       对应 FlickerAside.tsx + global.css
       CSS 定义在 components.css → .mf-aside__*
  ════════════════════════════════════════ -->
  <aside class="mf-aside">

    <!-- 头部：TeamSpaceSelect + 收起 -->
    <div class="mf-aside__header">
      <div class="mf-aside__workspace">
        <img class="mf-aside__workspace-avatar" src="../../assets/icons/workspace-myflicker.svg" alt="workspace" />
        <span class="mf-aside__workspace-name">个人空间</span>
        <span class="icon i-unfold mf-aside__workspace-unfold"></span>
      </div>
      <button class="mf-aside__collapse" aria-label="收起侧边栏">
        <span class="icon i-leftsidebar"></span>
      </button>
    </div>

    <!-- 主导航：新对话 / 搜索 / 定时任务 / 技能管理 / 知识库 -->
    <nav class="mf-aside__nav">
      <div class="mf-aside__nav-item is-active">
        <span class="icon i-newchat"></span>
        <span class="mf-aside__nav-item__label">新对话</span>
      </div>
      <div class="mf-aside__nav-item">
        <span class="icon i-search"></span>
        <span class="mf-aside__nav-item__label">搜索</span>
      </div>
      <div class="mf-aside__nav-item">
        <span class="icon i-schedule"></span>
        <span class="mf-aside__nav-item__label">定时任务</span>
      </div>
      <div class="mf-aside__nav-item">
        <span class="icon i-skill"></span>
        <span class="mf-aside__nav-item__label">技能</span>
      </div>
      <div class="mf-aside__nav-item">
        <span class="icon i-knowledge"></span>
        <span class="mf-aside__nav-item__label">知识</span>
      </div>
    </nav>

    <!-- 滚动区 -->
    <div class="mf-aside__body">

      <!-- section label：分组（is-always-show = actions 常驻）-->
      <div class="mf-aside__section-label is-always-show">
        <span>分组</span>
        <div class="mf-aside__section-label-actions">
          <button class="mf-aside__icon-btn" aria-label="新建分组">
            <span class="icon i-addgroup"></span>
          </button>
        </div>
      </div>

      <!-- 分组 1 — 展开 -->
      <div class="mf-aside__group">
        <div class="mf-aside__group-icon">
          <span class="icon i-openfolder"></span>
        </div>
        <span class="mf-aside__group-name">设计系统项目</span>
        <div class="mf-aside__group-actions">
          <button class="mf-aside__icon-btn" aria-label="新建会话">
            <span class="icon i-add"></span>
          </button>
          <button class="mf-aside__icon-btn" aria-label="更多">
            <span class="icon i-more"></span>
          </button>
        </div>
      </div>
      <div class="mf-aside__group-sessions">
        <div class="mf-aside__session">
          <span class="mf-aside__session-status">
            <span class="icon i-generating" style="color:var(--text-brand);"></span>
          </span>
          <span class="mf-aside__session-title">组件 Token 绑定机制</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">14:30</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
        <div class="mf-aside__session">
          <span class="mf-aside__session-status"></span>
          <span class="mf-aside__session-title">AI 对话页 UI Kit</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">昨天</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
        <div class="mf-aside__session">
          <span class="mf-aside__session-status">
            <span class="icon i-generationcompleted" style="color:var(--text-secondary);"></span>
          </span>
          <span class="mf-aside__session-title">颜色系统整理</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">2026/7/12</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
      </div>

      <!-- 分组 2 — 折叠 -->
      <div class="mf-aside__group" style="margin-top:4px;">
        <div class="mf-aside__group-icon">
          <span class="icon i-closefolder"></span>
        </div>
        <span class="mf-aside__group-name">个人任务</span>
        <div class="mf-aside__group-actions">
          <button class="mf-aside__icon-btn" aria-label="新建会话">
            <span class="icon i-add"></span>
          </button>
          <button class="mf-aside__icon-btn" aria-label="更多">
            <span class="icon i-more"></span>
          </button>
        </div>
      </div>

      <!-- section label：对话（sticky 吸顶）-->
      <div class="mf-aside__section-label">
        <span>对话</span>
        <div class="mf-aside__section-label-actions">
          <button class="mf-aside__icon-btn" aria-label="新建对话">
            <span class="icon i-add"></span>
          </button>
        </div>
      </div>

      <!-- 未分组会话列表 -->
      <div style="display:flex; flex-direction:column; gap:4px;">
        <div class="mf-aside__session is-active">
          <span class="mf-aside__session-status">
            <span class="icon i-generating" style="color:var(--text-brand);"></span>
          </span>
          <span class="mf-aside__session-title">构建 MyFlicker 世界</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">16:22</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
        <div class="mf-aside__session">
          <span class="mf-aside__session-status">
            <span class="icon i-pintotop" style="color:var(--text-tertiary);"></span>
          </span>
          <span class="mf-aside__session-title">帮我顶会议</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">今天</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
        <div class="mf-aside__session">
          <span class="mf-aside__session-status"></span>
          <span class="mf-aside__session-title">订机票</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">昨天</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
        <div class="mf-aside__session">
          <span class="mf-aside__session-status"></span>
          <span class="mf-aside__session-title">订机票</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">昨天</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
        <div class="mf-aside__session">
          <span class="mf-aside__session-status">
            <span class="icon i-draft" style="color:var(--text-tertiary);"></span>
          </span>
          <span class="mf-aside__session-title">设计规范草稿</span>
          <span class="mf-aside__session-meta">
            <span class="mf-aside__session-time">2026/7/13</span>
            <button class="mf-aside__icon-btn" aria-label="更多"><span class="icon i-more"></span></button>
          </span>
        </div>
      </div>

    </div><!-- /mf-aside__body -->

    <!-- 底部 footer：设置 + 积分胶囊 -->
    <div class="mf-aside__footer">
      <button class="mf-aside__footer-setting">
        <span class="icon i-setting"></span>
        <span>设置</span>
      </button>
      <div class="mf-aside__footer-credit">
        <img src="../../assets/icons/points-gradient.svg" width="14" height="14" style="flex-shrink:0;" />
        <span>积分：剩余 92%</span>
      </div>
    </div>

  </aside><!-- /mf-aside -->

  <!-- ════════════════════════════════════════
       MAIN AREA
  ════════════════════════════════════════ -->
  <main class="chat-main">

    <!-- Welcome 整体居中容器 -->
    <div class="chat-welcome-wrap">
      <div class="chat-welcome__headline">
        <img src="../../assets/icons/welcome-work-light.svg" alt="Work with Flicker" />
      </div>
      <div class="chat-input-inner--welcome">
        <div class="mf-chat-input-wrap">
          <div class="mf-chat-input">

            <textarea class="mf-chat-input__textarea" rows="1" placeholder="问点什么…" id="mainTextarea"></textarea>
            <div class="mf-chat-input__toolbar">
              <div class="mf-chat-input__toolbar-left">
                <button class="mf-chat-input__btn" aria-label="添加">
                  <span class="icon i-add"></span>
                </button>
                <button class="mf-chat-input__action">
                  <span class="icon i-skill"></span>
                  <span>技能</span>
                </button>
                <button class="mf-chat-input__action">
                  <span class="icon i-inspiration"></span>
                  <span>灵感触发</span>
                </button>
              </div>
              <div class="mf-chat-input__toolbar-right">
                <button class="mf-chat-input__model">
                  <img src="../../assets/icons/brand/claude.svg" width="14" height="14" alt="Claude" style="flex-shrink:0;">
                  <span>Claude Sonnet 4.6</span>
                  <span class="icon i-arrowdown mf-chat-input__model-arrow"></span>
                </button>
                <button class="mf-chat-input__send" aria-label="发送">
                  <span class="icon i-send"></span>
                </button>
              </div>
            </div>
          </div>
          <p class="mf-chat-input__notice">当前模型为公有云模型，请勿外泄公司内部信息</p>
        </div>
      </div>
    </div>

  </main>

</div><!-- /app-shell -->

<script>
  /* textarea auto-resize */
  const ta = document.getElementById('mainTextarea');
  function resizeTextarea() {
    ta.style.height = 'auto';
    const next = Math.min(ta.scrollHeight, 336);
    ta.style.height = next + 'px';
    ta.classList.toggle('is-overflow', ta.scrollHeight > 336);
  }
  ta.addEventListener('input', resizeTextarea);
  resizeTextarea();
</script>

</body>
</html>
