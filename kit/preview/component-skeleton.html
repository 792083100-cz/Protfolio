<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Skeleton</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style data-preview-shell>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-sm-font-family);
      font-size: var(--body-sm-font-size);
      line-height: var(--body-sm-line-height);
      font-weight: var(--body-sm-font-weight);
      letter-spacing: var(--body-sm-letter-spacing);
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      max-width: 100%;
    }

    body { padding: var(--spacer-32); }
    img, svg, video, canvas { max-width: 100%; }
    a { color: var(--text-default); text-decoration: none; }
    a:hover { color: var(--text-default-hover); }
    hr { border: 0; border-top: 1px solid var(--border-neutral-l1); margin: var(--spacer-24) 0; }

    .h1 { font-family: var(--heading-2xl-font-family); font-size: var(--heading-2xl-font-size); line-height: var(--heading-2xl-line-height); font-weight: var(--heading-2xl-font-weight); color: var(--text-default); }
    .h2 { font-family: var(--heading-md-font-family); font-size: var(--heading-md-font-size); line-height: var(--heading-md-line-height); font-weight: var(--heading-md-font-weight); color: var(--text-default); }
    .h3 { font-family: var(--heading-sm-font-family); font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); color: var(--text-default); }
    .eyebrow { font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: var(--body-xs-letter-spacing); }
    .text-secondary { color: var(--text-secondary); }
    .text-tertiary { color: var(--text-tertiary); }

    .row { display: flex; gap: var(--spacer-12); flex-wrap: wrap; align-items: center; }
    .col { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacer-24); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacer-24); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacer-24); }
    .stack-8 { display: flex; flex-direction: column; gap: var(--spacer-8); }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .stack-16 { display: flex; flex-direction: column; gap: var(--spacer-16); }
    .stack-24 { display: flex; flex-direction: column; gap: var(--spacer-24); }
    .stack-40 { display: flex; flex-direction: column; gap: var(--spacer-40); }

    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--border-neutral-l1); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); line-height: var(--heading-lg-line-height); font-weight: var(--heading-lg-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--text-secondary); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); margin-bottom: var(--spacer-12); color: var(--text-default); }
    .pv-section__sub { font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); color: var(--text-tertiary); margin-bottom: var(--spacer-12); }

    @media (max-width: 720px) {
      body { padding: var(--spacer-16); }
      .grid-2,
      .grid-3,
      .grid-4 { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../components.css" />
  <style>
</style>
</head>
<body>
  <div class="pv-header">
    <h1>Skeleton</h1>
    <p>Base color <code>--bg-overlay-l2</code>, shimmer <code>--bg-overlay-l3</code>. Show within 200ms of a request, hide as soon as data arrives.</p>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">Card skeleton</div>
    <div class="mf-card" style="max-width: 480px;">
      <div class="row" style="margin-bottom: var(--spacer-16);">
        <span class="mf-skeleton mf-skeleton--circle"></span>
        <div style="flex:1;">
          <span class="mf-skeleton mf-skeleton--title" style="display:block; margin-bottom: var(--spacer-8);"></span>
          <span class="mf-skeleton mf-skeleton--line" style="width:30%; display:block;"></span>
        </div>
      </div>
      <span class="mf-skeleton mf-skeleton--line" style="display:block; margin-bottom: var(--spacer-8);"></span>
      <span class="mf-skeleton mf-skeleton--line" style="width:80%; display:block; margin-bottom: var(--spacer-8);"></span>
      <span class="mf-skeleton mf-skeleton--line" style="width:60%; display:block;"></span>
    </div>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">List skeleton</div>
    <div class="grid-2" style="max-width: 960px;">

      <!-- 双行列表骨架屏 -->
      <div>
        <div class="pv-section__sub">Double-line</div>
        <div class="mf-card" style="padding: 0; overflow: hidden;">
          <div style="padding-top: 16px; display: flex; flex-direction: column; gap: 36px; padding-bottom: 16px;">
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                <span class="mf-skeleton" style="height:12px; width:55%;"></span>
                <span class="mf-skeleton" style="height:12px; width:70%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                <span class="mf-skeleton" style="height:12px; width:45%;"></span>
                <span class="mf-skeleton" style="height:12px; width:65%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                <span class="mf-skeleton" style="height:12px; width:50%;"></span>
                <span class="mf-skeleton" style="height:12px; width:60%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                <span class="mf-skeleton" style="height:12px; width:40%;"></span>
                <span class="mf-skeleton" style="height:12px; width:58%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                <span class="mf-skeleton" style="height:12px; width:48%;"></span>
                <span class="mf-skeleton" style="height:12px; width:63%;"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 单行列表骨架屏 -->
      <div>
        <div class="pv-section__sub">Single-line</div>
        <div class="mf-card" style="padding: 0; overflow: hidden;">
          <div style="padding-top: 16px; display: flex; flex-direction: column; gap: 36px; padding-bottom: 16px;">
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <span class="mf-skeleton" style="flex:1; height:12px;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <span class="mf-skeleton" style="flex:1; height:12px; width: 75%;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <span class="mf-skeleton" style="flex:1; height:12px; width: 85%;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <span class="mf-skeleton" style="flex:1; height:12px; width: 70%;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle"></span>
              <span class="mf-skeleton" style="flex:1; height:12px; width: 80%;"></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">List skeleton · Small</div>
    <div class="grid-2" style="max-width: 960px;">

      <!-- Small 双行 -->
      <div>
        <div class="pv-section__sub">Double-line · sm</div>
        <div class="mf-card" style="padding: 0; overflow: hidden;">
          <div style="padding-top: 16px; display: flex; flex-direction: column; gap: 36px; padding-bottom: 16px;">
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:55%;"></span>
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:70%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:45%;"></span>
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:65%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:50%;"></span>
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:60%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:40%;"></span>
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:58%;"></span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:48%;"></span>
                <span class="mf-skeleton mf-skeleton--line-sm" style="width:63%;"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Small 单行 -->
      <div>
        <div class="pv-section__sub">Single-line · sm</div>
        <div class="mf-card" style="padding: 0; overflow: hidden;">
          <div style="padding-top: 16px; display: flex; flex-direction: column; gap: 36px; padding-bottom: 16px;">
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <span class="mf-skeleton mf-skeleton--line-sm" style="flex:1;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <span class="mf-skeleton mf-skeleton--line-sm" style="flex:1; width:75%;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <span class="mf-skeleton mf-skeleton--line-sm" style="flex:1; width:85%;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <span class="mf-skeleton mf-skeleton--line-sm" style="flex:1; width:70%;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
              <span class="mf-skeleton mf-skeleton--circle-sm"></span>
              <span class="mf-skeleton mf-skeleton--line-sm" style="flex:1; width:80%;"></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
