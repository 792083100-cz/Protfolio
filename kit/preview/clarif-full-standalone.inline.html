/**
 * MyFlicker design system tokens
 * Light + Dark dual-mode tokens.
 *
 * Source of truth:
 * - Figma: Myflicker字体样式库
 * - Figma Variables: 颜色 (Color) / 间距 (Spacing) / 圆角 (Radius)
 *
 * Brand: Near-black (#242323) as primary
 * Modes: Light (default) + Dark ([data-theme="dark"])
 *
 * @group-priority: radius, spacers, font, body, heading, bg, bg-brand, text, icon, border, status
 */

/* ============================================================
   LIGHT MODE (default)
   ============================================================ */
:root {

  /* radius — from Figma borderRadius tokens */
  --radius-0: 0px;
  --radius-2: 2px;
  --radius-4: 4px;   /* borderRadiusSM */
  --radius-6: 6px;
  --radius-8: 8px;   /* borderRadius */
  --radius-10: 10px;
  --radius-12: 12px;
  --radius-16: 16px;
  --radius-20: 20px;
  --radius-24: 24px;
  --radius-32: 32px;
  --radius-full: 999px;
  --radius-xs: var(--radius-2);
  --radius-sm: var(--radius-4);
  --radius-md: var(--radius-6);
  --radius-lg: var(--radius-8);
  --radius-xl: var(--radius-10);
  --border-width-default: 1px;

  /* spacers — from Figma Spacing tokens */
  --spacer-0: 0px;
  --spacer-2: 2px;
  --spacer-3: 3px;
  --spacer-4: 4px;   /* SpacingXS */
  --spacer-6: 6px;   /* SpacingSM */
  --spacer-8: 8px;   /* Spacing (base) */
  --spacer-10: 10px;
  --spacer-12: 12px; /* SpacingL */
  --spacer-16: 16px; /* SpacingXL */
  --spacer-20: 20px;
  --spacer-24: 24px; /* SpacingXXL */
  --spacer-32: 32px;
  --spacer-40: 40px;
  --spacer-48: 48px;
  --spacer-64: 64px;

  /* icon sizes */
  --icon-size-12: 12px;
  --icon-size-14: 14px;
  --icon-size-16: 16px;
  --icon-size-20: 20px;
  --icon-size-24: 24px;

  /* font family */
  --font-family-default: "PingFang SC", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-family-heading: "PingFang SC", "SF Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-family-metric: "Inter", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-family-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* font weight — from Myflicker字体样式库 */
  --font-weight-default: 400;   /* regular */
  --font-weight-medium: 500;    /* medium */
  --font-weight-strong: 600;    /* bold */
  --font-weight-code: 450;

  --font-family-base: var(--font-family-default);
  --font-family-heading-alias: var(--font-family-heading);
  --font-family-mono-alias: var(--font-family-mono);

  /* ── body text styles (from Myflicker字体样式库) ── */

  /* 辅助描述 description · 12/18 · 400 */
  --body-xs-font-family: var(--font-family-default);
  --body-xs-font-size: 12px;
  --body-xs-font-weight: 400;
  --body-xs-line-height: 18px;
  --body-xs-letter-spacing: 0;

  /* 普通正文 regular · 13/20 · 400 */
  --body-sm-font-family: var(--font-family-default);
  --body-sm-font-size: 13px;
  --body-sm-font-weight: 400;
  --body-sm-line-height: 20px;
  --body-sm-letter-spacing: 0;

  /* 普通正文 medium · 13/20 · 500 */
  --body-sm-medium-font-family: var(--font-family-default);
  --body-sm-medium-font-size: 13px;
  --body-sm-medium-font-weight: 500;
  --body-sm-medium-line-height: 20px;
  --body-sm-medium-letter-spacing: 0;

  /* 普通正文 bold · 13/20 · 600 */
  --body-sm-bold-font-family: var(--font-family-default);
  --body-sm-bold-font-size: 13px;
  --body-sm-bold-font-weight: 600;
  --body-sm-bold-line-height: 20px;
  --body-sm-bold-letter-spacing: 0;

  /* 标题 medium · 16/24 · 500 */  /* NOTE: 16px/400 已去除，16px只用medium(500) */
  --body-md-medium-font-family: var(--font-family-default);
  --body-md-medium-font-size: 16px;
  --body-md-medium-font-weight: 500;
  --body-md-medium-line-height: 24px;
  --body-md-medium-letter-spacing: 0;

  /* 特大标题（一般不用）medium · 18/28 · 500 */
  --body-lg-font-family: var(--font-family-default);
  --body-lg-font-size: 18px;
  --body-lg-font-weight: 500;
  --body-lg-line-height: 28px;
  --body-lg-letter-spacing: 0;

  /* legacy aliases */
  --body-md-font-size: 16px;
  --body-md-font-weight: 400;
  --body-md-line-height: 24px;  /* kept as alias only, prefer --body-md-medium */
  /* legacy aliases — keep for component backward-compat */
  --body-xs-strong-font-size: 12px;
  --body-xs-strong-font-weight: 500;
  --body-xs-strong-line-height: 18px;
  --body-base-font-size: 13px;
  --body-base-font-weight: 400;
  --body-base-line-height: 20px;
  --body-base-letter-spacing: 0;
  --body-base-strong-font-size: 13px;
  --body-base-strong-font-weight: 500;
  --body-base-strong-line-height: 20px;

  /* ── heading text styles ── */
  --heading-xs-font-family: var(--font-family-default);
  --heading-xs-font-size: 13px;
  --heading-xs-font-weight: 600;
  --heading-xs-line-height: 20px;
  --heading-xs-letter-spacing: 0;

  --heading-sm-font-family: var(--font-family-default);
  --heading-sm-font-size: 16px;
  --heading-sm-font-weight: 600;
  --heading-sm-line-height: 24px;
  --heading-sm-letter-spacing: 0;

  --heading-md-font-family: var(--font-family-heading);
  --heading-md-font-size: 18px;
  --heading-md-font-weight: 600;
  --heading-md-line-height: 28px;
  --heading-md-letter-spacing: 0;

  --heading-lg-font-family: var(--font-family-heading);
  --heading-lg-font-size: 20px;
  --heading-lg-font-weight: 600;
  --heading-lg-line-height: 28px;
  --heading-lg-letter-spacing: 0;

  --heading-xl-font-family: var(--font-family-heading);
  --heading-xl-font-size: 24px;
  --heading-xl-font-weight: 600;
  --heading-xl-line-height: 32px;
  --heading-xl-letter-spacing: 0;

  --heading-2xl-font-family: var(--font-family-heading);
  --heading-2xl-font-size: 28px;
  --heading-2xl-font-weight: 600;
  --heading-2xl-line-height: 36px;
  --heading-2xl-letter-spacing: 0;

  --heading-3xl-font-family: var(--font-family-heading);
  --heading-3xl-font-size: 32px;
  --heading-3xl-font-weight: 600;
  --heading-3xl-line-height: 40px;
  --heading-3xl-letter-spacing: 0;

  --heading-display-font-family: var(--font-family-heading);
  --heading-display-font-size: 40px;
  --heading-display-font-weight: 600;
  --heading-display-line-height: 48px;
  --heading-display-letter-spacing: -0.02em;

  /* code */
  --code-editor-font-family: var(--font-family-mono);
  --code-editor-font-size: 13px;
  --code-editor-font-weight: 450;
  --code-editor-line-height: 20px;
  --code-terminal-font-family: var(--font-family-mono);
  --code-terminal-font-size: 12px;
  --code-terminal-font-weight: 450;
  --code-terminal-line-height: 18px;

  /* ── background — Neutral scale (Light) ── */
  /* N100=#FFFFFF N200=#F5F7FA N300=#F0F2F5 N400=#EBEDF0 */
  --bg-base-default: #FFFFFF;        /* colorBg · N100 */
  --bg-base-secondary: #F5F7FA;      /* N200 */
  --bg-base-tertiary: #F0F2F5;       /* N300 */
  --bg-overlay-l1: rgba(92, 96, 102, 0.08);
  --bg-overlay-l2: rgba(92, 96, 102, 0.12);
  --bg-overlay-l3: rgba(92, 96, 102, 0.16);
  --bg-overlay-l4: rgba(92, 96, 102, 0.20);
  --bg-white: #FFFFFF;
  --bg-menu: #FFFFFF;
  --bg-tooltip: #242323;              /* Inverted — matches Figma light-mode tooltip (dark bg + white text) */
  --bg-invert: #242323;              /* Primary 1000 */
  --bg-invert-hover: #4D4D4D;        /* Primary 900 */
  --bg-invert-active: #000000;       /* Primary 1100 */
  --bg-invert-disabled: rgba(36, 35, 35, 0.20);

  /* ── bg — status semantic backgrounds (from Figma 背景色) ── */
  --bg-success: #F0FFF4;             /* colorSuccessBg · G100 */
  --bg-success-hover: #DBFFE7;       /* colorSuccessBgHover · G200 */
  --bg-warning: #FFFCF0;             /* colorWarningBg · O100 */
  --bg-warning-hover: #FFF8E3;       /* colorWarningBgHover · O200 */
  --bg-error: #FFF2F0;               /* colorErrorBg · R100 */
  --bg-error-hover: #FFD9D4;         /* colorErrorBgHover · R200 */
  --bg-info: #E5F2FF;                /* colorInfoBg · B100 */
  --bg-info-hover: #D9ECFF;          /* colorInfoBgHover · B200 */
  --bg-mask: rgba(0, 0, 0, 0.45);   /* colorBgMask */

  /* ── fill — neutral fill scale (from Figma 填充色) ── */
  --fill-default: #E1E3E6;           /* colorFill · N600 — 一级填充 */
  --fill-secondary: #EBEDF0;         /* colorFillSecondary · N400 — 二级填充 */
  --fill-tertiary: #F0F2F5;          /* colorFillTertiary · N300 — 三级填充 */
  --fill-quaternary: #F5F7FA;        /* colorFillQuaternary · N200 — 四级填充 */
  --fill-white: #FFFFFF;             /* Colorfillwhite · N100 — 白色填充 */
  --fill-disabled: #EDEDED;          /* colorPrimaryDisable · Primary 200 */
  --color-background: var(--bg-base-default);
  --color-surface: var(--bg-base-secondary);
  --color-surface-variant: var(--bg-base-tertiary);
  --color-overlay-1: var(--bg-overlay-l1);
  --color-overlay-2: var(--bg-overlay-l2);
  --color-overlay-3: var(--bg-overlay-l3);
  --color-overlay-4: var(--bg-overlay-l4);
  --color-card: var(--bg-base-secondary);
  --color-tooltip: var(--bg-tooltip);
  --color-menu: var(--bg-menu);

  /* ── bg-brand — Primary (near-black) ── */
  /* Primary 1000=#242323  900=#4D4D4D  1100=#000000  100=#F6F6F6 */
  --bg-brand: #242323;               /* colorPrimary · Primary 1000 */
  --bg-brand-hover: #4D4D4D;         /* colorPrimaryHover · Primary 900 */
  --bg-brand-active: #000000;        /* colorPrimaryActive · Primary 1100 */
  --bg-brand-disabled: rgba(36, 35, 35, 0.22);
  --bg-brand-popup: rgba(36, 35, 35, 0.10);
  --bg-brand-subtle: #F6F6F6;        /* colorPrimaryBg · Primary 100 */
  --bg-brand-subtle-hover: #EDEDED;  /* colorPrimaryBgHover · Primary 200 */
  --color-primary: var(--bg-brand);
  --color-primary-hover: var(--bg-brand-hover);
  --color-primary-disabled: var(--bg-brand-disabled);
  --color-primary-soft: var(--bg-brand-popup);
  --color-accent: var(--bg-brand);

  /* ── text ── */
  /* N1000=#1F2329  N900=#5C6066  N800=#95999E  N700=#C4C7CC */
  --text-default: #1F2329;           /* colorText · N1000 */
  --text-default-hover: #0D0E0F;
  --text-default-active: #0D0E0F;
  --text-secondary: #5C6066;         /* colorTextSecondary · N900 */
  --text-secondary-hover: #1F2329;
  --text-secondary-active: #1F2329;
  --text-tertiary: #95999E;          /* colorTextTertiary · N800 */
  --text-disabled: #C4C7CC;          /* colorTextQuaternary · N700 */
  --text-onbrand: #FFFFFF;
  --text-onaccent: #FFFFFF;
  --text-white: #FFFFFF;
  --text-brand: #242323;             /* brand text (near-black) */
  --text-brand-hover: #4D4D4D;
  --color-foreground: var(--text-default);
  --color-foreground-hover: var(--text-default-hover);
  --color-on-surface: var(--text-default);
  --color-on-surface-variant: var(--text-secondary);
  --color-muted-foreground: var(--text-secondary);
  --color-disabled-foreground: var(--text-disabled);
  --color-on-primary: var(--text-onbrand);

  /* ── icon ── */
  --icon-default: #1F2329;
  --icon-default-hover: #0D0E0F;
  --icon-default-active: #0D0E0F;
  --icon-secondary: #5C6066;
  --icon-secondary-hover: #1F2329;
  --icon-secondary-active: #1F2329;
  --icon-tertiary: #95999E;
  --icon-disabled: #C4C7CC;
  --icon-onbrand: #FFFFFF;
  --icon-onaccent: #FFFFFF;
  --icon-white: #FFFFFF;
  --icon-brand: #242323;
  --icon-brand-hover: #4D4D4D;

  /* ── border ── */
  /* Figma: colorBorder=N400, colorBorderHover=N600, colorBorderSecondary=N300 */
  --border-neutral-l1: #EBEDF0;      /* colorBorder · N400 — 默认描边 */
  --border-neutral-l2: #E1E3E6;      /* colorBorderHover · N600 — 描边悬浮 */
  --border-neutral-subtle: #F0F2F5;  /* colorBorderSecondary · N300 — 次级浅描边 */
  --border-white: #FFFFFF;           /* ColorBorderwhite · N100 — 白色描边 */
  --border-brand: #242323;           /* colorPrimaryBorder · Primary 1000 */
  --border-brand-hover: #4D4D4D;     /* colorPrimaryBorderHover · Primary 900 */
  --border-success: #32E485;         /* colorSuccessBorder · G600 */
  --border-success-hover: #20BD6E;   /* colorSuccessBorderHover · G500→G700 */
  --border-warning: #FFB641;         /* colorWarningBorder · O600 */
  --border-warning-hover: #FFCA69;   /* colorWarningBorderHover · O500 */
  --border-error: #FF3135;           /* colorErrorBorder · R600 */
  --border-error-hover: #FF5C59;     /* colorErrorBorderHover · R500 */
  --color-border: var(--border-neutral-l1);
  --color-border-strong: var(--border-neutral-l2);
  --color-border-subtle: var(--border-neutral-subtle);
  --color-outline: var(--border-neutral-l1);

  /* ── status colors (from MF Figma palette) ── */
  /* Success: Polar Green G700=#20BD6E */
  --status-success-default: #20BD6E;
  --status-success-hover: #32E485;   /* G600 */
  --status-success-active: #129659;  /* G800 */
  --status-success-surface-l1: rgba(32, 189, 110, 0.12);
  --status-success-surface-l2: rgba(32, 189, 110, 0.18);
  --status-success-surface-l3: rgba(32, 189, 110, 0.36);

  /* Warning: Calendula Gold O600=#FFB641 */
  --status-warning-default: #FFB641;
  --status-warning-hover: #FFCA69;   /* O500 */
  --status-warning-active: #D9912B;  /* O700 */
  --status-warning-surface-l1: rgba(255, 182, 65, 0.12);
  --status-warning-surface-l2: rgba(255, 182, 65, 0.16);
  --status-warning-surface-l3: rgba(255, 182, 65, 0.36);

  /* Error: Duse Red R600=#FF3135 */
  --status-error-default: #FF3135;
  --status-error-hover: #FF5C59;     /* R500 */
  --status-error-active: #D91E28;    /* R700 */
  --status-error-surface-l1: rgba(255, 49, 53, 0.12);
  --status-error-surface-l2: rgba(255, 49, 53, 0.16);
  --status-error-surface-l3: rgba(255, 49, 53, 0.36);

  /* Info / Link: GEEK BLUE B700=#1380ED */
  --status-primary-default: #1380ED;
  --status-primary-hover: #339CFF;   /* B600 */
  --status-primary-active: #0A74DF;  /* B800 */
  --status-primary-surface-l1: rgba(19, 128, 237, 0.12);
  --status-primary-surface-l2: rgba(19, 128, 237, 0.18);
  --status-primary-surface-l3: rgba(19, 128, 237, 0.36);

  /* Alert (amber tone) */
  --status-alert-default: #FFB641;
  --status-alert-hover: #FFCA69;
  --status-alert-active: #D9912B;
  --status-alert-surface-l1: rgba(255, 182, 65, 0.14);
  --status-alert-surface-l2: rgba(255, 182, 65, 0.20);
  --status-alert-surface-l3: rgba(255, 182, 65, 0.36);

  --color-info: var(--status-primary-default);
  --color-success: var(--status-success-default);
  --color-warning: var(--status-warning-default);
  --color-error: var(--status-error-default);
  --color-error-soft: var(--status-error-surface-l1);

  /* ── brand palette — Primary (near-black) scale ── */
  --brand-50: #F6F6F6;   /* Primary 100 */
  --brand-100: #EDEDED;  /* Primary 200 */
  --brand-200: #DEDEDE;  /* Primary 300 */
  --brand-300: #DDDBDB;  /* Primary 400 */
  --brand-400: #D9D9D9;  /* Primary 500 */
  --brand-500: #C5C3C3;  /* Primary 600 */
  --brand-600: #999696;  /* Primary 700 */
  --brand-700: #737272;  /* Primary 800 */
  --brand-800: #4D4D4D;  /* Primary 900 */
  --brand-900: #242323;  /* Primary 1000 — main brand */
  --brand-950: #000000;  /* Primary 1100 */

  /* neutral grey scale (Figma Neutral palette) */
  --brand-grey-50: #FFFFFF;   /* N100 */
  --brand-grey-100: #F5F7FA;  /* N200 */
  --brand-grey-200: #F0F2F5;  /* N300 */
  --brand-grey-300: #EBEDF0;  /* N400 */
  --brand-grey-400: #E6E8EB;  /* N500 */
  --brand-grey-500: #E1E3E6;  /* N600 */
  --brand-grey-600: #C4C7CC;  /* N700 */
  --brand-grey-700: #95999E;  /* N800 */
  --brand-grey-800: #5C6066;  /* N900 */
  --brand-grey-900: #1F2329;  /* N1000 */
  --brand-grey-950: #0D0E0F;

  /* functional palette references */
  --brand-1: var(--brand-900);
  --brand-2: var(--brand-700);
  --brand-3: var(--brand-400);
  --brand-4: var(--brand-50);
  --site-canvas: var(--bg-base-default);
  --bg-layout-1: var(--bg-base-secondary);
  --bg-layout-2: var(--bg-overlay-l1);
  --border-1: var(--border-neutral-l1);

  /* ── purple accent — Golden Purple (P100-P1000) ──
     Use for: fill / border / background only. NOT for text.
     Binding logic mirrors Success/Warning/Error color pattern.
  */
  --purple-fill:             #722ED1;   /* colorPurple · P600 */
  --purple-fill-hover:       #9254DE;   /* P500 */
  --purple-fill-active:      #531DAB;   /* P700 */
  --purple-fill-disabled:    rgba(114, 46, 209, 0.22);
  --purple-border:           #722ED1;   /* P600 */
  --purple-border-hover:     #9254DE;   /* P500 */
  --purple-bg:               #F9F0FF;   /* P100 */
  --purple-bg-hover:         #EFDBFF;   /* P200 */
  --purple-bg-deep:          #D3ADF7;   /* P300 — stronger bg variant */
  --purple-surface-l1:       rgba(114, 46, 209, 0.12);
  --purple-surface-l2:       rgba(114, 46, 209, 0.18);
  --purple-surface-l3:       rgba(114, 46, 209, 0.36);

  /* accent colors (unchanged, functional accents) */
  --accent-teal: #00B983;
  --accent-coral: #FF6B45;
  --accent-amber: #F2A90C;
  --accent-lime: #5FC000;
  --accent-cyan: #00B6F5;
  --accent-blue: #1380ED;
  --accent-magenta: #EB2F96;
  --accent-violet: #9254DE;
  --accent-slate: #95999E;

  /* special */
  --special-white: #FFFFFF;
  --special-black: #000000;
  --special-bgtabsoverlay: rgba(255, 255, 255, 0.12);
  --special-mask: rgba(0, 0, 0, 0.45);  /* colorBgMask */

  /* generic fallback */
  --font-family: var(--font-family-default);
  --font-size: var(--body-xs-font-size);
  --font-weight: var(--body-xs-font-weight);
  --line-height: var(--body-xs-line-height);
}

  <style>

    .field__help { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; padding: 0; border: 0; background: transparent; color: var(--icon-tertiary); cursor: pointer; }
    .field__help:hover { color: var(--icon-secondary); }
    .field__help .icon-img { width: 14px; height: 14px; flex: 0 0 14px; }
    .field__help-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); display: none; padding: var(--spacer-6) var(--spacer-8); background: var(--bg-tooltip); color: var(--text-white); border-radius: var(--radius-8); font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); white-space: nowrap; box-shadow: 0 12px 32px color-mix(in srgb, var(--text-default) 16%, transparent); z-index: 10; }
    .field__help:hover .field__help-tooltip { display: block; }
    .dialog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacer-12); }
    .dialog-form .mf-input,
    .dialog-form .mf-select,
    .dialog-form .mf-textarea { background: var(--bg-base-default); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); letter-spacing: var(--body-sm-letter-spacing); }

    .dialog-form .mf-textarea { min-height: 72px; resize: none; }
    .dialog-calendar-icon { width: 16px; height: 16px; color: var(--icon-secondary); object-fit: contain; }
    @media (max-width: 720px) { .dialog-grid { grid-template-columns: 1fr; } }

/* ── Forms ─────────────────────────────────────────────────── */
/* ===== Input / Search ===== */
    .mf-input { display: flex; align-items: center; gap: var(--spacer-8); min-height: 32px; padding: 0 var(--spacer-12); background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); color: var(--text-default); width: 100%; font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); }
    .mf-input:focus-within { border-color: var(--border-brand); background: var(--bg-base-default); }

    .mf-search { position: relative; }
    .mf-select { width: 100%; height: 32px; padding: 0 var(--spacer-32) 0 var(--spacer-12); background-color: var(--bg-base-default); color: var(--text-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); appearance: none; -webkit-appearance: none; font: inherit; font-size: var(--body-sm-font-size); }
    .mf-select:focus { border-color: var(--border-brand); background-color: var(--bg-base-default); outline: none; }
    .mf-select:disabled { background-color: var(--bg-base-secondary); color: var(--text-disabled); cursor: not-allowed; opacity: 1; }
    .mf-select-wrap { position: relative; width: 100%; }
    .mf-select-wrap .mf-select { padding-right: var(--spacer-32); }
    .mf-select__icon { position: absolute; right: var(--spacer-12); top: 50%; width: 16px; height: 16px; color: var(--icon-secondary); pointer-events: none; transform: translateY(-50%); object-fit: contain; }
    .mf-select-wrap > .icon-img { position: absolute; top: 50%; right: var(--spacer-10); transform: translateY(-50%); color: var(--icon-secondary); pointer-events: none; }
    .icon-img { display: inline-block; width: 16px; height: 16px; flex: 0 0 16px; object-fit: contain; vertical-align: middle; }
    .icon-img--12 { width: 12px; height: 12px; flex-basis: 12px; }
    .icon-img--14 { width: 14px; height: 14px; flex-basis: 14px; }
    .mf-textarea { width: 100%; min-height: 96px; padding: var(--spacer-8) var(--spacer-12); background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); color: var(--text-default); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); resize: none; }
    .mf-textarea:focus { outline: none; border-color: var(--border-brand); background: var(--bg-base-default); }
    .mf-textarea.is-error { border-color: var(--status-error-default); }
    .mf-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: var(--bg-overlay-l3); border-radius: var(--radius-full); outline: none; }
    .mf-slider--progress { background: var(--bg-overlay-l3); }
    .mf-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: var(--radius-full); background: var(--bg-base-default); border: 1px solid var(--border-neutral-l2); box-shadow: none; cursor: pointer; }
    .mf-slider::-moz-range-track { height: 4px; background: var(--bg-overlay-l3); border-radius: var(--radius-full); }
    .mf-slider--progress::-moz-range-progress { height: 4px; background: var(--bg-brand); border-radius: var(--radius-full); }
    .mf-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: var(--radius-full); background: var(--bg-base-default); border: 1px solid var(--border-neutral-l2); box-shadow: none; cursor: pointer; }
    .mf-check, .mf-radio { display: inline-flex; align-items: center; gap: var(--spacer-8); min-height: 40px; font-size: var(--body-sm-font-size); color: var(--text-default); cursor: pointer; user-select: none; }
    .mf-check__box { width: 16px; height: 16px; border: 1px solid var(--border-neutral-l2); background: var(--bg-base-default); border-radius: var(--radius-4); display: inline-flex; align-items: center; justify-content: center; color: var(--text-onbrand); transition: background .12s, border-color .12s; }

    .mf-check input:checked + .mf-check__box::after { content: ''; width: 8px; height: 4px; border-left: 2px solid var(--text-onbrand); border-bottom: 2px solid var(--text-onbrand); transform: rotate(-45deg) translate(1px, -1px); }
    .mf-check input:disabled + .mf-check__box { opacity: .5; cursor: not-allowed; }
    .mf-radio__dot { width: 16px; height: 16px; border: 1px solid var(--border-neutral-l2); background: var(--bg-base-default); border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; }
    .mf-radio input { display: none; }
    .mf-radio input:checked + .mf-radio__dot { border-color: var(--bg-brand); }
    .mf-radio input:checked + .mf-radio__dot::after { content: ''; width: 10px; height: 10px; border-radius: var(--radius-full); background: var(--bg-brand); }
    .mf-switch { position: relative; display: inline-flex; width: 32px; height: 18px; background: var(--bg-overlay-l3); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-full); cursor: pointer; transition: background .15s, border-color .15s; }
    .mf-switch input { display: none; }
    .mf-switch__thumb { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--bg-base-default); border-radius: var(--radius-full); transition: left .15s, background .15s; }
    .mf-switch input:checked ~ .mf-switch__thumb { left: 16px; background: var(--icon-onbrand); }
    .mf-switch:has(input:checked) { background: var(--status-success-default); border-color: var(--status-success-default); }
    .input-affix { color: var(--text-tertiary); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); white-space: nowrap; }
    .mf-date-input { position: relative; }
    .mf-date-input input { padding-right: var(--spacer-32); }
    .mf-date-input input::-webkit-calendar-picker-indicator { opacity: 0; cursor: pointer; }
    .mf-date-input .icon-img { position: absolute; top: 50%; right: var(--spacer-12); transform: translateY(-50%); color: var(--icon-secondary); pointer-events: none; }
    .tag-field { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacer-6); min-height: 32px; padding: var(--spacer-4) var(--spacer-8); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); background: var(--bg-base-default); }
    .tag-field:focus-within { border-color: var(--border-brand); }
    .tag-remove { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; padding: 0; border: 0; background: transparent; color: currentColor; opacity: .55; cursor: pointer; border-radius: var(--radius-4); }
    .tag-remove:hover { opacity: 1; background: transparent; }
    .tag-remove .icon { width: 16px; height: 16px; }
    .stepper { display: inline-flex; align-items: center; width: fit-content; border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); overflow: hidden; background: var(--bg-base-default); }
    .stepper button { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; background: transparent; color: var(--icon-secondary); cursor: pointer; }
    .stepper button:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }
    .stepper input { width: 48px; height: 32px; padding: 0; border: 0; border-left: 1px solid var(--border-neutral-l1); border-right: 1px solid var(--border-neutral-l1); background: transparent; color: var(--text-default); text-align: center; font: inherit; line-height: var(--body-sm-line-height); appearance: textfield; -moz-appearance: textfield; }
    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ── Menu ──────────────────────────────────────────────────── */
/* ===== Menu ===== */
    .mf-menu { display: flex; flex-direction: column; gap: var(--spacer-2); background: var(--bg-menu); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-12); padding: var(--spacer-8); min-width: 180px; color: var(--text-default); box-shadow: 0 12px 32px color-mix(in srgb, var(--text-default) 12%, transparent), 0 2px 8px color-mix(in srgb, var(--text-default) 8%, transparent); }
    .mf-menu__item { display: flex; align-items: center; gap: var(--spacer-8); min-height: 32px; padding: var(--spacer-6) var(--spacer-8); border-radius: var(--radius-8); color: var(--text-default); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); font-weight: var(--body-sm-font-weight); cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; white-space: nowrap; }
    .mf-menu__item .icon { color: var(--icon-secondary); }
    .mf-menu__icon { width: 16px; height: 16px; flex: 0 0 auto; object-fit: contain; }
    .mf-menu__item:hover { background: var(--bg-brand-subtle-hover); }
    .mf-menu__check { display: none; align-items: center; justify-content: center; margin-left: auto; flex-shrink: 0; width: 14px; height: 14px; color: var(--icon-default); }
    .mf-menu__item.is-selected { font-weight: var(--body-sm-font-weight-bold, 500); }
    .mf-menu__item.is-selected .mf-menu__check { display: flex; }
    .mf-menu__item--danger { color: var(--status-error-default); }
    .mf-menu__item--danger .icon,
    .mf-menu__item--danger .mf-menu__icon { color: var(--status-error-default); }
    .mf-menu__divider { height: 1px; background: var(--border-neutral-l1); margin: var(--spacer-4) 0; }
    .mf-menu__shortcut { margin-left: auto; color: var(--text-tertiary); font-family: var(--body-md-font-family); font-size: var(--body-md-font-size); line-height: var(--body-md-line-height); font-weight: var(--body-md-font-weight); font-variant-numeric: normal; font-feature-settings: normal; }
    .mf-menu__group-label { padding: var(--spacer-8); color: var(--text-tertiary); font-family: var(--body-md-font-family); font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); font-weight: var(--body-xs-font-weight); letter-spacing: var(--body-xs-letter-spacing); text-transform: uppercase; }
    .mf-menu__arrow { margin-left: auto; display: inline-flex; align-items: center; color: var(--icon-secondary); flex-shrink: 0; width: 14px; height: 14px; }
    .mf-menu__arrow svg { width: 100%; height: 100%; }
    .mf-menu__item--submenu { position: relative; }
    .mf-menu__submenu { display: none; position: absolute; left: 100%; top: 50%; transform: translateY(-50%); z-index: 100; padding-left: 2px; }
    .mf-menu__item--submenu.is-open .mf-menu__submenu { display: block; }
    .mf-popover .mf-menu { border: 0; padding: 0; box-shadow: none; }

/* ── Pagination ────────────────────────────────────────────── */
/* ===== Pagination ===== */
    .mf-pagination { display: inline-flex; gap: var(--spacer-4); }
    .mf-pagination__item { min-width: 32px; height: 32px; padding: 0 var(--spacer-8); display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--text-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); font: inherit; font-size: var(--body-sm-font-size); cursor: pointer; }
    .mf-pagination__item:hover { background: var(--bg-overlay-l2); color: var(--text-default); }
    .mf-pagination__item.is-active { background: var(--bg-overlay-l3); color: var(--text-default); border-color: var(--border-neutral-l2); }
    .mf-pagination__item[disabled] { opacity: .4; cursor: not-allowed; }
    .mf-pagination__range { color: var(--text-tertiary); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); font-weight: var(--body-sm-font-weight); letter-spacing: var(--body-sm-letter-spacing); }

/* ── Progress ──────────────────────────────────────────────── */
/* ===== Progress ===== */
    .mf-progress { height: 6px; background: var(--bg-overlay-l2); border-radius: var(--radius-full); overflow: hidden; }
    .mf-progress__bar { height: 100%; background: var(--text-default); border-radius: inherit; }
    .mf-progress--brand .mf-progress__bar { background: var(--bg-brand); }

/* ── Skeleton ──────────────────────────────────────────────── */
/* ===== Skeleton ===== */
    .mf-skeleton { display: block; background: var(--bg-overlay-l2); border-radius: var(--radius-8); position: relative; overflow: hidden; }
    .mf-skeleton::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--bg-overlay-l3), transparent); animation: ds-skeleton-shine 1.6s ease-in-out infinite; }
    @keyframes ds-skeleton-shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .mf-skeleton--line { height: 12px; }
    .mf-skeleton--title { height: 18px; width: 50%; }
    .mf-skeleton--circle { width: 32px; height: 32px; border-radius: var(--radius-full); }
    .mf-skeleton--circle-sm { width: 16px; height: 16px; border-radius: var(--radius-full); }
    .mf-skeleton--line-sm { height: 8px; border-radius: var(--radius-full); }

/* ── Table ─────────────────────────────────────────────────── */
/* ===== Table ===== */
    .mf-table-card { overflow: hidden; border-radius: var(--radius-8); }
    .mf-table { width: 100%; min-width: 720px; border-collapse: collapse; }
    .mf-table--fixed { table-layout: fixed; }
    .mf-table__col-member { width: 22%; }
    .mf-table__col-role { width: 10%; }
    .mf-table__col-dept { width: 14%; }
    .mf-table__col-joined { width: 12%; }
    .mf-table__col-active { width: 12%; }
    .mf-table__col-status { width: 10%; }
    .mf-table__col-actions { width: 20%; }
    .mf-table th, .mf-table td { text-align: left; vertical-align: middle; border-bottom: 1px solid var(--border-neutral-l1); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); }
    .mf-table th { height: 40px; padding: 0 var(--spacer-12); color: var(--text-default); font-weight: var(--font-weight-medium); font-size: 13px; line-height: 1; background: var(--bg-base-secondary); }
    .mf-table th.mf-table__th--filterable { cursor: pointer; }
    .mf-table th.mf-table__th--filterable .mf-table__th-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .mf-table th.mf-table__th--filterable .mf-table__th-filter { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; color: var(--icon-secondary); margin-left: auto; }

    .mf-table th.mf-table__th--filterable.is-filtered .mf-table__th-filter { opacity: 1; color: var(--icon-brand); }
    .mf-table td { padding: var(--spacer-8) var(--spacer-12); }
    .mf-table td { color: var(--text-default); }
    .mf-table tr:last-child td { border-bottom: 1px solid var(--border-neutral-l1); }
    .mf-table td.num,
    .mf-table th.num { text-align: right; font-family: var(--code-editor-font-family); font-variant-numeric: tabular-nums; }
    .mf-table__member { display: flex; align-items: center; gap: var(--spacer-8); min-width: 0; }
    .mf-table__member-meta { display: flex; flex-direction: column; gap: var(--spacer-2); min-width: 0; }
    .mf-table__member-name { color: var(--text-default); font-weight: var(--font-weight-medium); white-space: nowrap; }
    .mf-table__member-email { color: var(--text-tertiary); font-size: 12px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mf-table td.mf-table__actions, .mf-table th.mf-table__actions { text-align: left; white-space: nowrap; }
    .mf-table td.mf-table__actions .mf-btn { padding: 0; }
    .mf-table td.mf-table__actions .mf-btn + .mf-btn { margin-left: var(--spacer-12); }

/* ── Tabs ──────────────────────────────────────────────────── */
/* ===== Tabs ===== */
    .mf-tabs { display: flex; gap: var(--spacer-24); border-bottom: 1px solid var(--border-neutral-l1); }
    .mf-tab { display: inline-flex; align-items: center; padding: var(--spacer-12) 0; background: transparent; border: none; color: var(--text-tertiary); cursor: pointer; font: inherit; font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); font-weight: var(--font-weight-medium); position: relative; }
    .mf-tab:hover { color: var(--text-default); }
    .mf-tab.is-active { color: var(--text-default); }
    .mf-tab.is-active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--icon-default); }

/* ── Tabs – Secondary (Pill / Capsule style) ──────────────── */
    .mf-tabs--pill {
      display: inline-flex;
      align-items: center;
      gap: var(--spacer-4);
      background: transparent;
      border-bottom: none;
      padding: 0;
      border-radius: var(--radius-12);
    }
    .mf-tab--pill {
      display: inline-flex;
      align-items: center;
      gap: var(--spacer-4);
      padding: var(--spacer-4) var(--spacer-12);
      height: 28px;
      border-radius: var(--radius-8);
      background: transparent;
      border: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font: inherit;
      font-size: var(--body-sm-font-size);
      line-height: var(--body-sm-line-height);
      font-weight: var(--body-sm-font-weight);
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .mf-tab--pill:hover { color: var(--text-default); background: var(--bg-overlay-l1); }
    .mf-tab--pill.is-active {
      background: var(--bg-overlay-l1);
      color: var(--text-default);
      font-weight: var(--body-sm-medium-font-weight);
    }
    /* 状态圆点 */
    .mf-tab--pill__dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--text-tertiary);
      flex-shrink: 0;
    }
    .mf-tab--pill.is-active .mf-tab--pill__dot { background: var(--status-success-default); }
    .mf-tab--pill:hover:not(.is-active) .mf-tab--pill__dot { background: var(--text-secondary); }
    .mf-tab__count,
    .mf-tab .mf-tag.num { margin-left: var(--spacer-6); min-width: 18px; height: 18px; padding: 0 var(--spacer-6); display: inline-grid; place-items: center; vertical-align: middle; border: none; border-radius: var(--radius-full); background: var(--bg-overlay-l2); color: var(--text-tertiary); font-family: var(--font-family-metric); font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); font-weight: var(--body-xs-font-weight); font-variant-numeric: tabular-nums; }

/* ── Tag ───────────────────────────────────────────────────── */
/* ===== Tag / Badge ===== */
    .mf-tag { display: inline-flex; align-items: center; gap: var(--spacer-4); height: 20px; padding: 0 var(--spacer-8); border-radius: var(--radius-4); font-size: 12px; line-height: 1; font-weight: var(--body-sm-font-weight); background: var(--bg-overlay-l2); color: var(--text-default); border: none; }
    .mf-tag .icon { width: 12px; height: 12px; }
    .mf-tag--brand { background: var(--bg-brand-popup); color: var(--text-default); }
    .mf-tag--success { background: var(--status-success-surface-l1); color: var(--text-default); }
    .mf-tag--warning { background: var(--status-warning-surface-l1); color: var(--text-default); }
    .mf-tag--danger { background: var(--status-error-surface-l1); color: var(--text-default); }
.mf-tag--info { background: var(--status-primary-surface-l1); color: var(--text-default); }

/* ── Model Picker ───────────────────────────────────────────── */
    .mf-model-picker { background: var(--bg-menu); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-12); box-shadow: 0 12px 32px color-mix(in srgb, var(--text-default) 12%, transparent), 0 2px 8px color-mix(in srgb, var(--text-default) 8%, transparent); width: 320px; padding: 4px; }
    .mf-model-picker__divider { height: 1px; background: var(--border-neutral-l1); margin: var(--spacer-4) 0; }
    .mf-model-picker__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: var(--spacer-2); }
    .mf-model-picker__item { display: flex; align-items: center; gap: var(--spacer-8); padding: var(--spacer-6) var(--spacer-8); border-radius: var(--radius-8); min-height: 32px; cursor: pointer; transition: background .12s; }
    .mf-model-picker__item:hover { background: var(--bg-brand-subtle-hover); }

    .mf-model-picker__icon { width: 20px; height: 20px; flex: 0 0 20px; display: flex; align-items: center; justify-content: center; color: var(--text-default); }
    .mf-model-picker__name { font-size: var(--body-sm-font-size); color: var(--text-default); white-space: nowrap; flex: 0 0 auto; }
    .mf-model-picker__meta { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; flex: 0 0 auto; }
    .mf-model-picker__spacer { flex: 1 1 auto; }
    .mf-model-picker__signal { display: flex; align-items: center; flex: 0 0 auto; }
    .mf-model-picker__check { display: flex; align-items: center; flex: 0 0 auto; color: var(--text-brand); }
    .mf-model-picker__add { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 32px; padding: var(--spacer-6) var(--spacer-8); border: none; border-radius: var(--radius-8); background: transparent; cursor: pointer; color: var(--text-secondary); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: 1; transition: background .12s, color .12s; }
    .mf-model-picker__add:hover { background: var(--bg-brand-subtle-hover); color: var(--text-default); }
    .mf-model-picker__add-arrow { color: var(--icon-tertiary); display: flex; align-items: center; }

/* @component-css-start: model-detail */
/* ── Model Detail Panel ─────────────────────────────────────── */
/* 二级悬浮面板：hover 模型列表行时出现，展示模型详细信息 */
    .mf-model-detail { position: absolute; left: -248px; top: 50%; transform: translateY(-50%); width: 240px; background: var(--bg-menu); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-12); box-shadow: 0 12px 32px color-mix(in srgb, var(--text-default) 12%, transparent), 0 2px 8px color-mix(in srgb, var(--text-default) 8%, transparent); padding: 10px; z-index: 100; pointer-events: none; opacity: 0; transition: opacity .15s; }
    .mf-model-picker__item { position: relative; }
    .mf-model-picker__item:hover .mf-model-detail { opacity: 1; pointer-events: auto; transition-delay: 0.1s; }

    /* — header — */
    .mf-model-detail__head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--spacer-8); padding-bottom: 0; }
    .mf-model-detail__head:has(.mf-model-detail__status) { padding-bottom: var(--spacer-12); margin-bottom: var(--spacer-12); border-bottom: 1px solid var(--border-neutral-l1); }
    .mf-model-detail__title { font-size: 13px; font-weight: 500; color: var(--text-default); line-height: 1.4; flex: 1; min-width: 0; padding-right: var(--spacer-8); }
    .mf-model-detail__status { display: flex; align-items: center; gap: var(--spacer-4); flex-shrink: 0; }
    .mf-model-detail__status img { width: 14px; height: 14px; flex-shrink: 0; }
    .mf-model-detail__status-label { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
    .mf-model-detail__status--ok   .mf-model-detail__status-label { color: var(--text-default); }
    .mf-model-detail__status--warn .mf-model-detail__status-label { color: var(--color-warning); }
    .mf-model-detail__status--error .mf-model-detail__status-label { color: var(--color-error); }

    /* — section label — */
    .mf-model-detail__section { font-size: 12px; color: var(--text-tertiary); margin-bottom: var(--spacer-8); }

    /* — capabilities list — */
    .mf-model-detail__caps { display: flex; flex-direction: column; gap: var(--spacer-6); }
    .mf-model-detail__cap { display: flex; align-items: center; gap: 6px; }
    .mf-model-detail__cap-icon { display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex: 0 0 14px; color: var(--color-success); }
    .mf-model-detail__cap-label { font-size: var(--body-sm-font-size); color: var(--text-secondary); }

    /* — toggle row (仅用私有部署模型) — */
    .mf-model-detail__toggle-row { display: flex; align-items: center; justify-content: space-between; padding-top: var(--spacer-12); margin-top: var(--spacer-12); border-top: 1px solid var(--border-neutral-l1); gap: var(--spacer-8); }
    .mf-model-detail__toggle-label { font-size: var(--body-sm-font-size); color: var(--text-tertiary); }

    /* — tier row (积分档位，v1.1.0+) — */
    .mf-model-detail__tier-divider { height: 1px; background: var(--border-neutral-l1); margin: var(--spacer-12) 0; }
    .mf-model-detail__tier-row { display: flex; flex-direction: column; gap: var(--spacer-8); }
    .mf-model-detail__tier-label { font-size: 12px; font-weight: 400; color: var(--text-tertiary); line-height: 1.4; }
    .mf-model-detail__tier-tabs { display: flex; align-items: center; background: var(--fill-tertiary); border-radius: var(--radius-8); padding: 2px; gap: 2px; }
    .mf-model-detail__tier-tab { display: block; flex: 1; padding: 2px 6px; border-radius: 6px; font-size: 12px; font-weight: 400; color: var(--text-tertiary); cursor: pointer; text-align: center; line-height: 20px; white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s; user-select: none; border: none; outline: none; -webkit-appearance: none; appearance: none; background: transparent; position: relative; font-family: var(--body-sm-font-family); }
    .mf-model-detail__tier-tab:focus { outline: none; }
    .mf-model-detail__tier-tab:hover { color: var(--text-secondary); }
    .mf-model-detail__tier-tab.is-active { background: var(--bg-base-default); color: var(--text-default); box-shadow: 0 1px 3px color-mix(in srgb, var(--text-default) 10%, transparent); }
    .mf-model-detail__tier-tab__rate { font-size: 11px; font-weight: 400; color: var(--text-tertiary); margin-left: 3px; }
    .mf-model-detail__tier-tab.is-active .mf-model-detail__tier-tab__rate { color: var(--text-secondary); }
    .mf-model-detail__tier-tab::after { content: attr(data-tooltip); position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%); background: color-mix(in srgb, var(--text-default) 88%, transparent); color: var(--bg-base-default); font-size: 11px; font-weight: 400; line-height: 1.4; white-space: nowrap; padding: 5px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 20; }
    .mf-model-detail__tier-tab:hover::after { opacity: 1; }
/* @component-css-end: model-detail */

/* ── Aside / Sidebar ────────────────────────────────────────── */
/* ===== FlickerAside — 侧导航业务组件 =====
   用法：<aside class="mf-aside"> … </aside>
   设计对照：FlickerAside.tsx + global.css
     hover/active 背景   = --fill-default  (#E1E3E6)
     sidebar 背景        = --bg-brand-subtle (#F6F6F6)
     文字 primary        = --text-default  (#1F2329)
     文字 tertiary       = --text-tertiary (#95999E)
*/
    /* ── 容器 ── */
    .mf-aside { width: 240px; flex-shrink: 0; background: var(--bg-brand-subtle); display: flex; flex-direction: column; height: 100%; overflow: hidden; border-radius: var(--radius-8); padding: 0 0 8px; }

    /* ── 头部：workspace + 收起 ── */
    .mf-aside__header { height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }

    .mf-aside__workspace { flex: 1; display: flex; align-items: center; gap: var(--spacer-8); padding: 0 4px; border-radius: var(--radius-8); cursor: pointer; transition: background 120ms; min-width: 0; }

    .mf-aside__workspace-avatar { width: 24px; height: 24px; border-radius: var(--radius-6); flex-shrink: 0; object-fit: cover; }
    .mf-aside__workspace-name { min-width: 0; font-size: 13px; font-weight: 500; color: var(--text-default); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mf-aside__workspace-unfold { color: var(--text-secondary); flex-shrink: 0; margin-left: 0; }

    .mf-aside__collapse { width: 20px; height: 20px; border-radius: var(--radius-4); border: none; background: transparent; cursor: pointer; color: var(--text-default); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 120ms; }
    .mf-aside__collapse:hover { background: var(--fill-default); }

    /* ── 主导航 ── */
    .mf-aside__nav { padding: 8px 8px 0; display: flex; flex-direction: column; gap: 4px; }

    .mf-aside__nav-item { display: flex; align-items: center; gap: var(--spacer-6); height: 32px; padding: 0 var(--spacer-8); border-radius: var(--radius-8); cursor: pointer; color: var(--text-default); font-size: 13px; font-weight: 500; transition: background 120ms; user-select: none; }
    .mf-aside__nav-item .icon { color: var(--text-default); }
    .mf-aside__nav-item:hover { background: var(--fill-default); }
    .mf-aside__nav-item.is-active { background: var(--fill-default); }
    .mf-aside__nav-item__label { flex: 1; }

    /* ── 滚动区 ── */
    .mf-aside__body { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .mf-aside__body::-webkit-scrollbar { width: 3px; }
    .mf-aside__body::-webkit-scrollbar-track { background: transparent; }
    .mf-aside__body::-webkit-scrollbar-thumb { background: var(--fill-default); border-radius: 2px; }

    /* ── section label（分组 / 对话 — sticky 吸顶）── */
    .mf-aside__section-label { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 0 0 var(--spacer-4) 8px; font-size: 12px; line-height: 18px; color: var(--text-tertiary); background: var(--bg-brand-subtle); }
    .mf-aside__section-label-actions { display: flex; gap: 2px; visibility: hidden; }
    .mf-aside__section-label:hover .mf-aside__section-label-actions { visibility: visible; }
    .mf-aside__section-label.is-always-show .mf-aside__section-label-actions { visibility: visible; }

    /* ── 图标按钮（sidebar 内）── */
    .mf-aside__icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: var(--radius-4); border: none; background: transparent; cursor: pointer; color: var(--text-tertiary); transition: background 120ms, color 120ms; flex-shrink: 0; }
    .mf-aside__icon-btn:hover { background: var(--fill-default); color: var(--text-default); }

    /* ── 分组行（SessionGroupItem）── */
    .mf-aside__group { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 var(--spacer-8); border-radius: var(--radius-8); cursor: pointer; transition: background 120ms; }
    .mf-aside__group:hover { background: var(--fill-default); }
    .mf-aside__group:hover .mf-aside__group-actions { visibility: visible; }

    .mf-aside__group-icon { position: relative; width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .mf-aside__group-name { flex: 1; font-size: 13px; font-weight: 400; color: var(--text-default); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 2px; }
    .mf-aside__group-actions { display: flex; gap: 0; visibility: hidden; }

    /* ── 分组内会话列表 ── */
    .mf-aside__group-sessions { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }

    /* ── 会话列表项（SessionItem）── */
    .mf-aside__session { position: relative; display: flex; align-items: center; height: 32px; padding: 0 var(--spacer-8); border-radius: var(--radius-8); cursor: pointer; font-size: 13px; color: var(--text-default); transition: background 120ms; }
    .mf-aside__session:hover { background: var(--fill-default); }
    .mf-aside__session.is-active { background: var(--fill-default); }
    .mf-aside__session:hover .mf-aside__session-meta { opacity: 1; }
    .mf-aside__session:hover .mf-aside__session-title { margin-right: 64px; }

    .mf-aside__session-status { position: absolute; left: 8px; display: flex; align-items: center; width: 16px; height: 16px; flex-shrink: 0; }
    .mf-aside__session-title { flex: 1; min-width: 0; padding-left: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: margin 120ms; }
    .mf-aside__session-meta { position: absolute; right: 8px; display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 120ms; }
    .mf-aside__session-time { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }

    /* ── 底部 footer ── */
    .mf-aside__footer { flex-shrink: 0; padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; }

    .mf-aside__footer-setting { display: flex; align-items: center; gap: var(--spacer-6); height: 26px; padding: 0 var(--spacer-8); border-radius: var(--radius-8); border: none; background: transparent; cursor: pointer; color: var(--text-default); font-family: var(--body-sm-font-family); font-size: 12px; transition: background 120ms; }
    .mf-aside__footer-setting:hover { background: var(--fill-default); }

    .mf-aside__footer-credit { display: flex; align-items: center; gap: var(--spacer-6); height: 26px; padding: 0 10px; border-radius: var(--radius-full); border: 1px solid var(--border-neutral-l1); background: var(--bg-base-default); color: var(--text-default); font-size: 12px; cursor: pointer; transition: background 120ms; white-space: nowrap; }
    .mf-aside__footer-credit:hover { background: var(--fill-default); }

/* ── Chat Input ─────────────────────────────────────────────── */
/* ===== ChatInput — 对话输入框业务组件 =====
   用法：<div class="mf-chat-input-wrap"> … </div>
   设计对照：preview/chat-input.html · components/business/chat-input.json
*/
    .mf-chat-input-wrap { display: flex; flex-direction: column; width: 100%; max-width: 800px; }
    .mf-chat-input { display: flex; flex-direction: column; width: 100%; background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-12); padding: 12px; box-shadow: 0 4px 13.7px 6px rgba(21,21,21,0.05); position: relative; z-index: 1; }
    .mf-chat-input__textarea { width: 100%; min-height: 56px; max-height: 336px; background: transparent; border: none; outline: none; resize: none; color: var(--text-default); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); padding: 0; overflow-y: hidden; }
    .mf-chat-input__textarea::placeholder { color: var(--text-tertiary); }
    .mf-chat-input__toolbar { display: flex; align-items: center; gap: var(--spacer-4); margin-top: var(--spacer-12); }
    .mf-chat-input__toolbar-left { display: flex; align-items: center; gap: var(--spacer-4); flex: 1 1 auto; min-width: 0; }
    .mf-chat-input__toolbar-right { display: flex; align-items: center; gap: var(--spacer-8); flex: 0 0 auto; }
    .mf-chat-input__btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: none; border-radius: var(--radius-8); background: transparent; color: var(--icon-secondary); cursor: pointer; flex: 0 0 28px; }
    .mf-chat-input__btn:hover { background: var(--bg-overlay-l1); color: var(--icon-default); }
    .mf-chat-input__btn:active { background: var(--bg-overlay-l2); color: var(--icon-default); }
    .mf-chat-input__action { display: inline-flex; align-items: center; gap: var(--spacer-4); height: 28px; padding: 0 var(--spacer-8); border: none; border-radius: var(--radius-8); background: transparent; color: var(--text-secondary); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: 1; cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
    .mf-chat-input__action:hover { background: var(--bg-overlay-l1); color: var(--text-default); }
    .mf-chat-input__action:active { background: var(--bg-overlay-l2); color: var(--text-default); }
    .mf-chat-input__model { display: inline-flex; align-items: center; gap: var(--spacer-4); height: 28px; padding: 0 var(--spacer-8); border: none; border-radius: var(--radius-8); background: transparent; color: var(--text-secondary); font-family: var(--body-sm-font-family); font-size: var(--body-sm-font-size); line-height: 1; cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
    .mf-chat-input__model:hover { background: var(--bg-overlay-l1); color: var(--text-default); }
    .mf-chat-input__model-arrow { width: 16px; height: 16px; flex: 0 0 16px; color: var(--icon-tertiary); }
    .mf-chat-input__send { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 28px; border: none; border-radius: var(--radius-8); background: var(--bg-brand); color: var(--icon-onbrand); cursor: pointer; transition: background .15s; }
    .mf-chat-input__send:hover { background: var(--bg-brand-hover); }
    .mf-chat-input__send:active { background: var(--bg-brand-active); }
    .mf-chat-input__send[disabled] { background: var(--bg-brand-disabled); cursor: not-allowed; }
    .mf-chat-input__project-area { margin-top: -12px; padding: 20px var(--spacer-12) var(--spacer-8); background: var(--bg-brand-subtle); border-radius: 0 0 var(--radius-8) var(--radius-8); display: flex; align-items: center; gap: var(--spacer-8); flex-wrap: wrap; }
    .mf-chat-input__project-bar { display: inline-flex; align-items: center; gap: var(--spacer-4); height: 28px; padding: var(--spacer-4) var(--spacer-6); background: transparent; border-radius: var(--radius-8); color: var(--text-tertiary); font-size: var(--body-sm-font-size); line-height: 1; cursor: pointer; border: none; flex: 0 0 auto; }
    .mf-chat-input__project-bar:hover { background: var(--bg-brand-subtle-hover); color: var(--text-tertiary); }
    .mf-chat-input__notice { text-align: center; font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); color: var(--text-tertiary); padding: var(--spacer-8) 0 var(--spacer-4); }

    /* — attachments row — */
    .mf-chat-input__attachments { display: flex; align-items: flex-start; gap: var(--spacer-8); padding-bottom: 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .mf-chat-input__attachments::-webkit-scrollbar { display: none; }

    /* file card — 56px 高，四周 12px padding */
    .mf-chat-input__attachment { position: relative; display: flex; align-items: center; gap: var(--spacer-8); flex: 0 0 240px; width: 240px; height: 56px; padding: 12px; background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); cursor: default; overflow: hidden; box-sizing: border-box; }
    .mf-chat-input__attachment:hover .mf-chat-input__attachment-remove { opacity: 1; }

    .mf-chat-input__attachment-icon { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: 0 0 24px; color: var(--icon-secondary); }
    .mf-chat-input__attachment-icon--pdf  { color: #EF4444; }
    .mf-chat-input__attachment-icon--txt  { color: var(--icon-secondary); }
    .mf-chat-input__attachment-icon--word { color: #3B82F6; }
    .mf-chat-input__attachment-icon--img  { width: 24px; height: 24px; border-radius: var(--radius-4); overflow: hidden; background: var(--bg-overlay-l1); flex: 0 0 24px; }
    .mf-chat-input__attachment-icon--img img { width: 100%; height: 100%; object-fit: cover; }

    .mf-chat-input__attachment-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
    .mf-chat-input__attachment-name { font-size: 12px; line-height: 1.4; color: var(--text-default); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mf-chat-input__attachment-meta { font-size: 10px; line-height: 1.4; color: var(--text-tertiary); }

    .mf-chat-input__attachment-remove { position: absolute; top: 4px; right: 4px; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex: 0 0 20px; border: none; border-radius: var(--radius-full); background: var(--bg-overlay-inverse); color: var(--text-default); cursor: pointer; opacity: 0; transition: opacity .15s; padding: 0; }

    /* uploading state — full-card background fill */
    .mf-chat-input__attachment--uploading { background: linear-gradient(to right, var(--bg-brand-subtle-hover) var(--upload-progress, 0%), var(--bg-brand-subtle) var(--upload-progress, 0%)); border-color: transparent; }
    .mf-chat-input__attachment--uploading .mf-chat-input__attachment-name { color: var(--text-default); }

/* ── Prompt Pills ─────────────────────────────────────── */
.mf-prompt-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.mf-prompt-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 14px;
  border-radius: 999px !important;
  -webkit-appearance: none;
  appearance: none;
  border: 1px solid var(--border-neutral-l1);
  background: var(--bg-base-default);
  color: var(--text-default);
  font-size: 13px;
  line-height: 1.4;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease;
}

.mf-prompt-pill .icon {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  color: var(--text-default);
  background-color: var(--text-default);
}

.mf-prompt-pill:hover {
  background: var(--bg-brand-subtle);
  color: var(--text-default);
}

.mf-prompt-pill:hover .icon {
  color: var(--text-default);
  background-color: var(--text-default);
}

.mf-prompt-pill:active {
  background: var(--bg-brand-subtle-hover);
  color: var(--text-default);
}

/* ── List Page — 列表页页面模板 ─────────────────────────────
   Scene: ui_kits/list-page/index.html
   结构：app-shell > mf-aside + list-main > page-topnav + page-content
   ─────────────────────────────────────────────────────────── */

/* App Shell */
.app-shell { display: flex; height: 100vh; width: 100%; background: var(--bg-brand-subtle); gap: 4px; }

/* 列表页主区（mf-aside 右侧内容面板）*/
.list-main {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  background: var(--bg-base-default); border-radius: var(--radius-8);
  overflow: hidden; margin: 8px 8px 8px 0; height: calc(100vh - 16px);
}

/* 顶部一级 Tab 导航 */
.page-topnav {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--spacer-16) var(--spacer-20) 0;
  flex-shrink: 0; gap: var(--spacer-12);
}
.page-topnav-tabs { display: flex; flex-wrap: wrap; gap: var(--spacer-4) 0; flex: 1; min-width: 0; }
.page-topnav-tab {
  display: inline-flex; align-items: center; padding: 0; height: auto;
  background: transparent; border: none; color: var(--text-tertiary);
  cursor: pointer; font: inherit; font-size: 16px; font-weight: 400;
  position: relative; white-space: nowrap;
}
.page-topnav-tab + .page-topnav-tab { margin-left: var(--spacer-24); }
.page-topnav-tab:hover { color: var(--text-default); }
.page-topnav-tab.is-active { color: var(--text-default); font-weight: 500; }

/* 内容区（二级 Tab + 工具栏 + 表格 + 分页 垂直堆叠）*/
.page-content {
  flex: 1; overflow-y: auto;
  padding: var(--spacer-20) var(--spacer-24);
  display: flex; flex-direction: column; gap: var(--spacer-16);
}
.page-content::-webkit-scrollbar { width: 4px; }
.page-content::-webkit-scrollbar-track { background: transparent; }
.page-content::-webkit-scrollbar-thumb { background: var(--border-neutral-l1); border-radius: 2px; }

/* 工具栏（搜索 + 操作按钮）*/
.toolbar { display: flex; align-items: center; gap: var(--spacer-8); }
.toolbar-search { flex: 1; position: relative; display: flex; align-items: center; }
.toolbar-search__icon {
  position: absolute; left: var(--spacer-10);
  display: flex; align-items: center;
  color: var(--text-tertiary); pointer-events: none;
}
.toolbar-search__input {
  width: 100%; height: 28px;
  padding: 0 var(--spacer-10) 0 var(--spacer-32);
  border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8);
  background: var(--bg-base-default); color: var(--text-default);
  font: inherit; font-size: var(--body-sm-font-size); outline: none;
  transition: border-color 0.15s;
}
.toolbar-search__input::placeholder { color: var(--text-disabled); }
.toolbar-search__input:focus { border-color: var(--border-neutral-l2); }
.toolbar-actions { display: flex; align-items: center; gap: var(--spacer-8); flex-shrink: 0; }

/* 表格行 hover */
.mf-table tbody tr:hover td { background: var(--bg-base-secondary); }

/* Checkbox 首列修饰（添加到 .mf-table 上）*/
.mf-table--has-checkbox th:first-child,
.mf-table--has-checkbox td:first-child {
  width: 40px !important; min-width: 40px !important; max-width: 40px !important;
  padding: 0 !important; text-align: center; vertical-align: middle;
}
.mf-table--has-checkbox th:first-child > *,
.mf-table--has-checkbox td:first-child > * {
  display: inline-flex; align-items: center; justify-content: center;
}

/* Checkbox 控件 */
.mf-checkbox {
  width: 14px; height: 14px;
  border: 1px solid var(--border-neutral-l2); border-radius: var(--radius-2);
  background: var(--bg-base-default);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.mf-checkbox:hover { border-color: var(--icon-default); }

/* 条目单元格（图标 + 标题 + 描述，通用于各列表页）*/
.mf-item-cell { display: flex; align-items: center; gap: var(--spacer-10); min-width: 0; }
.mf-item-cell__icon {
  width: 36px; height: 36px; border-radius: var(--radius-8);
  border: 1px solid var(--border-neutral-l1); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-base-secondary); font-size: 18px; line-height: 1;
}
.mf-item-cell__meta { display: flex; flex-direction: column; gap: var(--spacer-2); min-width: 0; }
.mf-item-cell__name-row { display: flex; align-items: center; gap: var(--spacer-6); }
.mf-item-cell__name {
  font-size: var(--body-sm-font-size); font-weight: var(--font-weight-medium);
  color: var(--text-default); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mf-item-cell__desc {
  font-size: 12px; color: var(--text-tertiary); line-height: 18px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Tag 变体：来源标签（小号、深底）*/
.mf-tag--source {
  background: var(--bg-overlay-l2); color: var(--text-secondary);
  font-size: 11px; height: 18px; padding: 0 var(--spacer-6);
  border-radius: var(--radius-4); white-space: nowrap;
}

/* 操作列链接（text 风格，无按钮框）*/
.action-links { display: flex; align-items: center; gap: var(--spacer-12); }
.action-link {
  font-size: var(--body-sm-font-size); color: var(--text-default);
  cursor: pointer; border: none; background: transparent; padding: 0; font: inherit;
}
.action-link:hover { color: var(--text-secondary); text-decoration: underline; }
.action-link--danger:hover { color: var(--status-error-default); text-decoration: underline; }

/* @component-css-start: skill-add-dialog */
/* 添加技能弹窗 — 基于 .mf-dialog 延展的业务组件 */

.mf-dialog--skill-add { max-width: 800px; max-height: calc(90vh - 100px); display: flex; flex-direction: column; }
.mf-dialog--skill-add .mf-dialog__body { padding: 0; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

.skill-add__toolbar {
  display: flex; align-items: center; gap: var(--spacer-8);
  padding: var(--spacer-8) var(--spacer-24) var(--spacer-12);
}
.skill-add__search-wrap {
  flex: 1; position: relative; display: flex; align-items: center;
}
.skill-add__search-icon {
  position: absolute; left: var(--spacer-8); width: 14px; height: 14px;
  color: var(--icon-tertiary); pointer-events: none;
}
.skill-add__search-icon > svg { display: block; width: 100%; height: 100%; }
.skill-add__search-input {
  width: 100%; height: 28px; padding: 0 var(--spacer-10) 0 28px;
  background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-8); font: inherit; font-size: var(--body-sm-font-size);
  color: var(--text-default); outline: none; transition: border-color 0.15s;
}
.skill-add__search-input::placeholder { color: var(--text-tertiary); }
.skill-add__search-input:focus { border-color: var(--border-neutral-l2); }

.skill-add__filter-wrap { position: relative; display: inline-flex; align-items: center; }
.skill-add__filter-select {
  height: 28px; padding: 0 24px 0 var(--spacer-10);
  background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-8); font: inherit; font-size: var(--body-sm-font-size);
  color: var(--text-default); appearance: none; -webkit-appearance: none;
  cursor: pointer; outline: none;
}
.skill-add__filter-select:focus { border-color: var(--border-neutral-l2); }
.skill-add__filter-arrow {
  position: absolute; right: var(--spacer-6); width: 14px; height: 14px;
  color: var(--icon-secondary); pointer-events: none;
}
.skill-add__filter-arrow > svg { display: block; width: 100%; height: 100%; }

.skill-add__list { overflow-y: auto; min-height: 560px; }

.skill-add__item { padding: 0 var(--spacer-24); cursor: pointer; position: relative; }
.skill-add__item + .skill-add__item::before {
  content: ''; display: block; height: 1px; background: var(--border-neutral-l1);
}
.skill-add__item-inner {
  display: flex; align-items: center; gap: var(--spacer-12);
  padding: var(--spacer-16) var(--spacer-20) var(--spacer-16) var(--spacer-12);
  transition: background 0.12s;
}
.skill-add__item:hover .skill-add__item-inner { background: var(--bg-brand-subtle); }

.skill-add__avatar {
  width: 40px; height: 40px; border-radius: var(--radius-8);
  flex-shrink: 0; overflow: hidden;
}
.skill-add__avatar img { width: 100%; height: 100%; display: block; }

.skill-add__info {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--spacer-2);
}
.skill-add__name-row { display: flex; align-items: center; gap: var(--spacer-6); flex-wrap: wrap; }
.skill-add__name {
  font-size: var(--body-sm-font-size); font-weight: var(--body-sm-font-weight);
  color: var(--text-default); white-space: nowrap;
}
.skill-add__desc {
  font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height);
  color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.skill-add__action {
  flex-shrink: 0; width: 28px; height: 28px; display: inline-flex;
  align-items: center; justify-content: center;
  background: var(--bg-brand-subtle); border: none; border-radius: var(--radius-8);
  cursor: pointer; padding: 0; transition: background 0.12s;
}
.skill-add__action:hover { background: var(--bg-brand-subtle-hover); }
.skill-add__action .ac-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;

/* @component-css-start: popover */

/* ── Popover 子结构 ──────────────────────────────────────────
   扩展自 .mf-popover，提供三种内容变体的结构类：
   1. .mf-popover--dark        深色面板（用户列表等）
   2. .mf-popover__header      面板标题行
   3. .mf-popover__list        无序列表容器
   4. .mf-popover__item        列表行（avatar + 文字）
   5. .mf-popover__avatar      行内头像（圆形）
   6. .mf-popover__group       浅色分组标题
   7. .mf-popover__info-row    信息条目行（彩色标记 + 文字）
   ─────────────────────────────────────────────────────────── */

/* 深色面板变体 — 用于可见范围、用户列表等深色 hover 面板 */
.mf-popover.mf-popover--dark {
  background: var(--bg-tooltip);
  border: 1px solid transparent;
  color: var(--text-white);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
}

/* 面板标题行 */
.mf-popover__header {
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
  color: var(--text-secondary);
  padding: var(--spacer-4) var(--spacer-8) var(--spacer-8);
  margin-bottom: var(--spacer-4);
}
.mf-popover.mf-popover--dark .mf-popover__header {
  color: rgba(255, 255, 255, 0.55);
}

/* 列表容器 */
.mf-popover__list {
  display: flex;
  flex-direction: column;
  gap: var(--spacer-4);
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 240px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* 列表行 */
.mf-popover__item {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  padding: var(--spacer-6) var(--spacer-8);
  border-radius: var(--radius-8);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  white-space: nowrap;
}
.mf-popover.mf-popover--dark .mf-popover__item {
  color: var(--text-white);
}

/* 圆形头像（纯色背景 + 首字母） */
.mf-popover__avatar {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  color: var(--text-white);
  background: var(--bg-brand-subtle-hover, #E0E0E0);
  user-select: none;
  overflow: hidden;
}
.mf-popover__avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}

/* 分组标题（浅色面板用） */
.mf-popover__group {
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
  color: var(--text-tertiary);
  padding: var(--spacer-8) var(--spacer-8) var(--spacer-4);
}
/* 非首个分组上方加分隔线 */
.mf-popover__group + .mf-popover__group,
.mf-popover__list + .mf-popover__group {
  margin-top: var(--spacer-4);
  padding-top: var(--spacer-8);
  border-top: 1px solid var(--border-neutral-l1);
}

/* 信息条目行（彩色圆点 + 文字，用于进度/用量提示面板） */
.mf-popover__info-row {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  padding: var(--spacer-8) var(--spacer-12);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--text-default);
}
.mf-popover__info-row + .mf-popover__info-row {
  border-top: 1px solid var(--border-neutral-l1);
}

/* 彩色圆形标记 */
.mf-popover__dot {
  width: 8px;
  height: 8px;
  min-width: 8px;
  border-radius: var(--radius-full);
  background: currentColor;
}
.mf-popover__dot--success { color: var(--status-success-default); }
.mf-popover__dot--warning { color: var(--status-warning-default); }
.mf-popover__dot--error   { color: var(--status-error-default); }
.mf-popover__dot--info    { color: var(--status-primary-default); }

/* @component-css-end: popover */

/* @component-css-start: prompt-pills-drill */
/* Prompt Pills 下钻交互 — 一级/二级 pills + 溢出「更多」面板 */

/* 容器：不换行，水平滚动裁剪 */
.mf-prompt-pills-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  width: 100%;
}

/* 二级下钻 pill：无描边，灰底，hover 加深 */
.mf-drill-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: none;
  background: var(--bg-brand-subtle);
  color: var(--text-default);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  flex-shrink: 0;
  transition: background 0.15s;
}
.mf-drill-pill:hover { background: var(--bg-brand-subtle-hover); }

/* 返回按钮（back 变体） */
.mf-drill-pill--back { color: var(--text-default); }

/* pills 溢出时隐藏（JS checkOverflow 控制） */
.mf-pill-hidden { visibility: hidden; pointer-events: none; flex-shrink: 0; }

/* 「更多」按钮 */
.mf-pills-more-btn {
  display: none;
  flex-shrink: 0;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border-neutral-l1);
  background: var(--bg-base-default);
  color: var(--text-default);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  transition: background 0.15s;
}
.mf-pills-more-btn:hover { background: var(--bg-brand-subtle); }
.mf-pills-more-btn.is-visible { display: inline-flex; }
.mf-pills-more-btn.is-open .mf-pills-more-arrow { transform: rotate(180deg); }
.mf-pills-more-arrow { transition: transform 0.15s; display: inline-flex; }

/* 「更多」下拉面板容器（相对定位锚点） */
.mf-pills-more-wrap { position: relative; flex-shrink: 0; }

/* 下拉面板 */
.mf-pills-more-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  z-index: 100;
  background: var(--bg-menu);
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-8);
  box-shadow: 0 8px 24px rgba(21, 21, 21, 0.10);
  padding: 4px;
  min-width: 180px;
  display: none;
}
.mf-pills-more-panel.is-open { display: block; }

.mf-pills-more-item {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border-radius: var(--radius-4);
  border: none;
  background: transparent;
  color: var(--text-default);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  width: 100%;
  text-align: left;
  transition: background 0.15s;
}
.mf-pills-more-item:hover { background: var(--bg-overlay-l1); }
.mf-pills-more-item .icon { flex-shrink: 0; }

/* @component-css-end: prompt-pills-drill */

/* @component-css-start: global-search */

/* ── Global Search Dialog ── */
.gs-dialog {
  width: 640px;
  background: var(--bg-base-default);
  border-radius: var(--radius-12);
  box-shadow: 0 8px 40px 0 rgba(0,0,0,.12), 0 2px 8px 0 rgba(0,0,0,.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.gs-dialog__head {
  display: flex;
  align-items: center;
  height: 48px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border-neutral-l1);
  flex-shrink: 0;
  gap: 12px;
}

/* 默认态：搜索占位文字 */
.gs-dialog__title {
  flex: 1 1 auto;
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--text-tertiary);
}

/* 搜索态：input */
.gs-dialog__input {
  flex: 1 1 auto;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  font-weight: var(--body-sm-font-weight);
  color: var(--text-default);
  caret-color: var(--color-info);
  min-width: 0;
}
.gs-dialog__input::placeholder { color: var(--text-tertiary); }

/* 清除按钮 */
.gs-dialog__clear {
  flex-shrink: 0;
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--text-secondary);
  padding: 0;
  transition: color 0.15s;
}
.gs-dialog__clear:hover { color: var(--text-default); }

/* header 竖分割线 */
.gs-dialog__head-divider {
  width: 1px;
  height: 16px;
  background: var(--border-neutral-l1);
  flex-shrink: 0;
}

/* 关闭按钮 */
.gs-dialog__close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  background: transparent;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
}
.gs-dialog__close:hover { background: transparent; }
.gs-dialog__close .ac-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center;
}

.gs-dialog__body {
  padding: 8px 12px 12px;
  max-height: 440px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ── Section group ── */
.gs-section__label {
  padding: 8px 4px 4px;
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
  color: var(--text-tertiary);
}

/* ── List item ── */
.gs-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: var(--radius-8);
  cursor: pointer;
  transition: background 0.15s;
}
.gs-item:hover { background: var(--bg-overlay-l1); }

.gs-item__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  -webkit-mask-size: contain;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
}
