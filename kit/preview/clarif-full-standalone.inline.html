/* 内容区（标题行 + 描述行） */
.gs-item__content {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.gs-item__row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.gs-item__title {
  flex: 1 1 auto;
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--text-default);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.gs-item__date {
  flex-shrink: 0;
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--text-tertiary);
}

.gs-item__desc {
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 关键词高亮 mark ── */
.gs-mark {
  background: var(--bg-overlay-l2);
  color: var(--text-default);
  font-weight: var(--body-sm-medium-font-weight);
  border-radius: 3px;
  padding: 0 2px;
}

/* @component-css-end: global-search */

/* @component-css-start: settings-panel */

.settings-panel {
  background: var(--bg-menu);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-12);
  box-shadow: 0 12px 32px color-mix(in srgb, var(--text-default) 12%, transparent),
              0 2px 8px  color-mix(in srgb, var(--text-default) 8%, transparent);
  width: 280px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.settings-panel__list {
  padding: var(--spacer-8);
  display: flex;
  flex-direction: column;
  gap: var(--spacer-4);
}

.settings-panel__item {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  min-height: 32px;
  padding: var(--spacer-4) var(--spacer-8);
  border-radius: var(--radius-8);
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  color: var(--text-default);
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  font-weight: var(--body-sm-font-weight);
}

.settings-panel__item:hover {
  background: var(--bg-brand-subtle-hover);
}

.settings-panel__icon {
  width: 16px;
  height: 16px;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.settings-panel__icon.ac-icon {
  -webkit-mask-size: contain;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  background-color: var(--icon-secondary);
}

.settings-panel__label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.settings-panel__value {
  color: var(--text-secondary);
  font-size: var(--body-sm-font-size);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: var(--spacer-4);
  flex-shrink: 0;
}

.settings-panel__value .sp-arrow {
  width: 16px;
  height: 16px;
  color: var(--icon-tertiary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.settings-panel__value .sp-arrow svg {
  width: 16px;
  height: 16px;
}

.settings-panel__divider {
  height: 1px;
  background: var(--border-neutral-l1);
  margin: var(--spacer-4) 0;
}

.settings-panel__footer {
  padding: 0 var(--spacer-12) var(--spacer-12);
}

.settings-panel__cta {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 36px;
  border-radius: var(--radius-8);
  background: var(--bg-invert);
  color: var(--text-white);
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  font-weight: 500;
  border: none;
  cursor: pointer;
  letter-spacing: 0.01em;
}

.settings-panel__cta:hover {
  background: var(--bg-invert-hover);
}

/* @component-css-end: settings-panel */

/* @component-css-start: toast */
/* ── Toast 全局提示 ─────────────────────────────────────────── */

/* 浮层容器 — 固定于页面顶部居中，管理多条 toast 的纵向堆叠 */
.mf-toast-container {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacer-8);
  pointer-events: none;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.mf-toast-container .mf-notif {
  pointer-events: all;
}

/* 浮动修饰符 — 白底 + colorBorder 描边 + 阴影，所有语义状态下均保持不变 */
.mf-notif--float {
  background: var(--bg-base-default) !important;
  border-color: var(--border-neutral-l1) !important;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0, 0, 0, 0.06);
  width: auto !important; /* hug content */
}
/* float 模式下文字不 flex 拉伸，保持自然宽度，右侧操作靠 gap 间距 8px */
.mf-notif--float .mf-notif__text {
  flex: none;
}

/* 倒计时文字 */
.mf-notif__countdown {
  flex-shrink: 0;
  margin-left: var(--spacer-4);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--text-tertiary);
  white-space: nowrap;
}

/* 关闭按钮图标 — KID mask 模式 */
.mf-notif__close .ac-icon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center;
}
.mf-notif__close .ac-i-close {
  -webkit-mask-image: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDI0IDEwMjQiPjxwYXRoIGZpbGw9IiM4OThBOEMiIGQ9Ik03NTYuNDggODEwLjY4OCAyMTMuMzEyIDI2Ny41MkEzOC40IDM4LjQgMCAxIDEgMjY3LjY0OCAyMTMuMzEyTDgxMC42ODggNzU2LjQ4QTM4LjQgMzguNCAwIDEgMSA3NTYuNDggODEwLjY4OFoiPjwvcGF0aD48cGF0aCBmaWxsPSIjODk4QThDIiBkPSJNNzU2LjQ4IDIxMy4zMTJBMzguNCAzOC40IDAgMSAxIDgxMC42MjQgMjY3LjU4NEwyNjcuNjQ4IDgxMC42ODhBMzguNCAzOC40IDAgMSAxIDIxMy4zNzYgNzU2LjQxNkw3NTYuNDggMjEzLjMxMloiPjwvcGF0aD48L3N2Zz4=);
  mask-image: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDI0IDEwMjQiPjxwYXRoIGZpbGw9IiM4OThBOEMiIGQ9Ik03NTYuNDggODEwLjY4OCAyMTMuMzEyIDI2Ny41MkEzOC40IDM4LjQgMCAxIDEgMjY3LjY0OCAyMTMuMzEyTDgxMC42ODggNzU2LjQ4QTM4LjQgMzguNCAwIDEgMSA3NTYuNDggODEwLjY4OFoiPjwvcGF0aD48cGF0aCBmaWxsPSIjODk4QThDIiBkPSJNNzU2LjQ4IDIxMy4zMTJBMzguNCAzOC40IDAgMSAxIDgxMC42MjQgMjY3LjU4NEwyNjcuNjQ4IDgxMC42ODhBMzguNCAzOC40IDAgMSAxIDIxMy4zNzYgNzU2LjQxNkw3NTYuNDggMjEzLjMxMloiPjwvcGF0aD48L3N2Zz4=);
  background-color: var(--icon-secondary);
}
.mf-notif__close:hover .ac-i-close { background-color: var(--icon-default); }

/* 入场 / 退场动画 */
@keyframes mf-toast-in {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes mf-toast-out {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-8px); }
}
.mf-notif--entering { animation: mf-toast-in 0.2s ease forwards; }
.mf-notif--leaving  { animation: mf-toast-out 0.2s ease forwards; }

/* @component-css-end: toast */

/* @component-css-start: chat-input-code */
/* ── Chat Input · Code 模式变体 ─────────────────────────────
   与 .mf-chat-input 完全共用 wrap / textarea / toolbar / send / project-area / notice。
   Code 模式仅是 toolbar 内部结构差异（模式/模型/权限 picker + context/earth 图标按钮），
   项目区改为多 pill；无新增独有类。
   设计对照：preview/component-chat-input-code.html · components/business/chat-input-code.json
*/
/* @component-css-end: chat-input-code */

/* @component-css-start: question-clarification */
/* ── Question Clarification 问题澄清卡片 ────────────────────── */

.mf-clarif {
  display: flex;
  flex-direction: column;
  background: var(--bg-base-default);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-12);
  overflow: hidden;
}

/* ── Header ── */
.mf-clarif__head {
  display: flex;
  align-items: center;
  gap: var(--spacer-6);
  padding: var(--spacer-12) var(--spacer-12) var(--spacer-12) var(--spacer-16);
  flex-shrink: 0;
}

.mf-clarif__head-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--text-secondary);
}

.mf-clarif__head-icon .ac-icon {
  width: 16px;
  height: 16px;
}

.mf-clarif__title {
  flex: 1;
  font-size: 12px;
  line-height: 1.5;
  font-weight: var(--body-sm-font-weight);
  color: var(--text-default);
}

.mf-clarif__pager {
  display: inline-flex;
  align-items: center;
  gap: var(--spacer-4);
  flex-shrink: 0;
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.5;
}

.mf-clarif__pager-text {
  min-width: 20px;
  text-align: center;
}

.mf-clarif__pager-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 0;
  border-radius: var(--radius-8);
}

.mf-clarif__pager-btn:hover {
  color: var(--text-default);
}

.mf-clarif__pager-btn .ac-icon {
  width: 16px;
  height: 16px;
}

.mf-clarif__pager-btn[disabled],
.mf-clarif__pager-btn:disabled {
  color: var(--text-disabled);
  cursor: not-allowed;
  pointer-events: none;
}

/* ── Body ── */
.mf-clarif__body {
  flex: 1;
  padding: 0 var(--spacer-8);
  overflow-y: auto;
}

/* ── Footer ── */
.mf-clarif__foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--spacer-12);
  padding: var(--spacer-8) var(--spacer-12) var(--spacer-12);
  flex-shrink: 0;
}

/* ── Question Choice List ── */
.mf-clarif__question {
  margin-bottom: var(--spacer-12);
}

.mf-clarif__question-title {
  font-size: 12px;
  line-height: 1.5;
  font-weight: 600;
  color: var(--text-default);
  padding: 0 var(--spacer-12);
  margin-bottom: var(--spacer-12);
}

.mf-clarif__choices {
  display: flex;
  flex-direction: column;
  gap: var(--spacer-4);
}

.mf-clarif__choice {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  padding: var(--spacer-6);
  cursor: pointer;
  position: relative;
  background: transparent;
  transition: background 0.12s;
  height: 32px;
  border-radius: var(--radius-8);
}

.mf-clarif__choice + .mf-clarif__choice::before {
  content: none;
}

.mf-clarif__choice:hover {
  background: var(--fill-tertiary);
}

.mf-clarif__choice:hover .mf-clarif__choice-key,
.mf-clarif__choice:hover .mf-clarif__choice-text,
.mf-clarif__choice--focused .mf-clarif__choice-key,
.mf-clarif__choice--focused .mf-clarif__choice-text {
  color: var(--text-default);
}

.mf-clarif__choice:hover .mf-clarif__choice-text--placeholder,
.mf-clarif__choice--focused .mf-clarif__choice-text--placeholder {
  color: var(--text-tertiary);
}

.mf-clarif__choice--active {
  background: var(--fill-tertiary);
}

.mf-clarif__choice--focused {
  background: var(--fill-tertiary);
}

/* A/B/C/D 底色方块 */
.mf-clarif__choice-key {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  line-height: 1;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--fill-white);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-4, 4px);
}

.mf-clarif__choice-key--selected {
  color: var(--text-default);
}

/* 文字 + 推荐标签并排 */
.mf-clarif__choice-main {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
}

.mf-clarif__choice-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
  min-width: 0;
}

.mf-clarif__choice-text--selected {
  color: var(--text-default);
}

.mf-clarif__choice-text--placeholder {
  color: var(--text-tertiary);
}
}


.mf-clarif__choice-enter {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: center;
  line-height: 0;
  color: var(--icon-tertiary);
}

.mf-clarif__choice-enter .ac-icon {
  width: 16px;
  height: 16px;
  display: block;
  flex-shrink: 0;
  vertical-align: middle;
}

/* ── Placeholder body ── */
.mf-clarif__placeholder {
  background: var(--fill-tertiary);
  border-radius: var(--radius-8);
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: var(--body-sm-font-size);
}

/* ── Icon mask 注册 ── */
.mf-clarif .ac-icon {
  -webkit-mask-size: contain;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  display: inline-block;
  flex-shrink: 0;
}

<body>

  <div class="demo-wrap">
    <div class="mf-clarif" id="clarif-demo">
      <div class="mf-clarif__head">
        <span class="mf-clarif__head-icon">
          <span class="ac-icon ac-i-newconversation" style="width:16px;height:16px;"></span>
        </span>
        <span class="mf-clarif__title">请回答以下问题</span>
        <div class="mf-clarif__pager">
          <button class="mf-clarif__pager-btn" id="btn-prev" disabled>
            <span class="ac-icon ac-i-arrowup" style="width:16px;height:16px;"></span>
          </button>
          <span class="mf-clarif__pager-text" id="pager-text">1/3</span>
          <button class="mf-clarif__pager-btn" id="btn-next">
            <span class="ac-icon ac-i-arrowdown" style="width:16px;height:16px;"></span>
          </button>
        </div>
      </div>
      <div class="mf-clarif__body" id="clarif-body"></div>
      <div class="mf-clarif__foot">
        <button class="mf-btn mf-btn--ghost mf-btn--md" id="btn-skip">跳过回答</button>
        <button class="mf-btn mf-btn--secondary mf-btn--md" id="btn-prev-step" style="display:none;">上一步</button>
        <button class="mf-btn mf-btn--secondary mf-btn--md" id="btn-next-step" disabled>下一步</button>
        <button class="mf-btn mf-btn--primary mf-btn--md" id="btn-submit" style="display:none;" disabled>提交</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        title: '1. 福利中心页面的文件组织结构应该如何安排？',
        choices: [
          { key: 'A', text: '福利中心文件组织结构规则', recommended: true },
          { key: 'B', text: '福利中心文件组织结构规则：在现有的目录下创建新文件创建新文件创建新文件' },
          { key: 'C', text: '福利中心文件组织结构规则：在现有的' },
          { key: 'D', text: '或输入自定义答案...', placeholder: true },
        ]
      },
      {
        title: '2. 是否需要同时支持暗色主题？',
        choices: [
          { key: 'A', text: '是，需要完整暗色主题支持', recommended: true },
          { key: 'B', text: '否，仅支持亮色主题' },
          { key: 'C', text: '跟随系统主题自动切换' },
          { key: 'D', text: '或输入自定义答案...', placeholder: true },
        ]
      },
      {
        title: '3. 页面路由方案优先选择？',
        choices: [
          { key: 'A', text: '基于现有路由规范扩展', recommended: true },
          { key: 'B', text: '新建独立路由模块' },
          { key: 'C', text: '沿用旧版路由结构' },
          { key: 'D', text: '或输入自定义答案...', placeholder: true },
        ]
      }
    ];

    let current = 0;
    const selections = new Array(questions.length).fill(null);

    const body       = document.getElementById('clarif-body');
    const pagerText  = document.getElementById('pager-text');
    const btnPrev    = document.getElementById('btn-prev');
    const btnNext    = document.getElementById('btn-next');
    const btnNextStep= document.getElementById('btn-next-step');
    const btnPrevStep= document.getElementById('btn-prev-step');
    const btnSubmit  = document.getElementById('btn-submit');

    let focusedIndex = 0;

    function goTo(index) {
      current = Math.max(0, Math.min(questions.length - 1, index));
      const sel = selections[current];
      const q = questions[current];
      focusedIndex = sel ? q.choices.findIndex(c => c.key === sel) : 0;
      render();
    }

    const customAnswers = new Array(questions.length).fill('');

    function selectChoice(key) {
      const q = questions[current];
      const choice = q.choices.find(c => c.key === key);
      focusedIndex = q.choices.findIndex(c => c.key === key);
      if (choice && choice.placeholder) {
        selections[current] = key;
        render();
        const input = document.getElementById('custom-input');
        if (input) { input.focus(); input.value = customAnswers[current]; }
        return;
      }
      selections[current] = key;
      render();
      if (current < questions.length - 1) {
        setTimeout(() => goTo(current + 1), 180);
      }
    }

    function render() {
      const q = questions[current];
      const selected = selections[current];
      const total = questions.length;
      const selectedChoice = q.choices.find(c => c.key === selected);
      const isCustomActive = selectedChoice && selectedChoice.placeholder;

      pagerText.textContent = `${current + 1}/${total}`;
      btnPrev.disabled = current === 0;
      btnNext.disabled = current === total - 1;
      btnNextStep.disabled = selected === null || (isCustomActive && !customAnswers[current].trim());

      const isLast = current === total - 1;
      btnNextStep.style.display  = isLast ? 'none' : '';
      btnPrevStep.style.display  = current > 0 ? '' : 'none';
      btnSubmit.style.display    = isLast ? '' : 'none';
      btnSubmit.disabled         = selected === null || (isCustomActive && !customAnswers[current].trim());

      body.innerHTML = `
        <div class="mf-clarif__question">
          <div class="mf-clarif__question-title">${q.title}</div>
          <div class="mf-clarif__choices" id="choices-list">
            ${q.choices.map((c, i) => {
              const isSelected = selected === c.key;
              const isFocused  = focusedIndex === i;
              let cls = 'mf-clarif__choice';
              if (isSelected) cls += ' mf-clarif__choice--active';
              if (isFocused && !isSelected)  cls += ' mf-clarif__choice--focused';
              const keyCls = (isSelected || isFocused) ? 'mf-clarif__choice-key mf-clarif__choice-key--selected' : 'mf-clarif__choice-key';
              const showEnter = isSelected || isFocused;
              if (c.placeholder && isSelected) {
                return `
                <div class="${cls}" data-key="${c.key}" data-idx="${i}">
                  <span class="${keyCls}">${c.key}</span>
                  <span class="mf-clarif__choice-main" style="flex:1;min-width:0;">
                    <input id="custom-input"
                      type="text"
                      class="mf-clarif__custom-input"
                      placeholder="输入自定义答案..."
                      value="${customAnswers[current].replace(/"/g, '&quot;')}"
                    />
                  </span>
                  ${customAnswers[current].trim() || isFocused ? `<span class="mf-clarif__choice-enter"><span class="ac-icon ac-i-enterkey"></span></span>` : ''}
                </div>`;
              }
              if (c.placeholder && !isSelected) {
                const savedText = customAnswers[current];
                const textCls2 = savedText
                  ? 'mf-clarif__choice-text'
                  : 'mf-clarif__choice-text mf-clarif__choice-text--placeholder';
                return `
                <div class="${cls}" data-key="${c.key}" data-idx="${i}">
                  <span class="${keyCls}">${c.key}</span>
                  <span class="mf-clarif__choice-main">
                    <span class="${textCls2}">${savedText || c.text}</span>
                  </span>
                  ${isFocused ? `<span class="mf-clarif__choice-enter"><span class="ac-icon ac-i-enterkey"></span></span>` : ''}
                </div>`;
              }
              const textCls = c.placeholder
                ? 'mf-clarif__choice-text mf-clarif__choice-text--placeholder'
                : (isSelected ? 'mf-clarif__choice-text mf-clarif__choice-text--selected' : 'mf-clarif__choice-text');
              return `
              <div class="${cls}" data-key="${c.key}" data-idx="${i}">
                <span class="${keyCls}">${c.key}</span>
                <span class="mf-clarif__choice-main">
                  <span class="${textCls}">${c.text}</span>
                  ${c.recommended ? `<span class="mf-tag">推荐</span>` : ''}
                </span>
                ${showEnter ? `<span class="mf-clarif__choice-enter"><span class="ac-icon ac-i-enterkey"></span></span>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>
      `;

      body.querySelectorAll('.mf-clarif__choice').forEach(el => {
        el.addEventListener('click', () => {
          const q = questions[current];
          const choice = q.choices.find(c => c.key === el.dataset.key);
          if (choice && choice.placeholder && selections[current] === el.dataset.key) return;
          selectChoice(el.dataset.key);
        });
      });

      const customInput = document.getElementById('custom-input');
      if (customInput) {
        customInput.addEventListener('input', () => {
          customAnswers[current] = customInput.value;
          btnNextStep.disabled = !customInput.value.trim();
          btnSubmit.disabled = !customInput.value.trim();
          const enterSlot = customInput.closest('.mf-clarif__choice').querySelector('.mf-clarif__choice-enter');
          if (customInput.value.trim()) {
            if (!enterSlot) {
              const span = document.createElement('span');
              span.className = 'mf-clarif__choice-enter';
              span.innerHTML = `<span class="ac-icon ac-i-enterkey"></span>`;
              customInput.closest('.mf-clarif__choice').appendChild(span);
            }
          } else {
            if (enterSlot) enterSlot.remove();
          }
        });
        customInput.addEventListener('keydown', e => {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.stopPropagation();
          if (e.key === 'Enter') {
            e.preventDefault();
            if (customInput.value.trim()) {
              if (current < questions.length - 1) {
                setTimeout(() => goTo(current + 1), 100);
              } else {
                // 最后一题：确认输入，退出编辑态，不直接提交
                customInput.blur();
              }
            }
            return;
          }
          if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.preventDefault();
            e.stopPropagation();
            customInput.blur();
            focusedIndex = e.key === 'ArrowUp'
              ? focusedIndex - 1
              : focusedIndex + 1;
            const q = questions[current];
            focusedIndex = Math.max(0, Math.min(q.choices.length - 1, focusedIndex));
            selections[current] = null;
            render();
          }
        });
      }
    }

    btnPrev.addEventListener('click', () => goTo(current - 1));
    btnNext.addEventListener('click', () => goTo(current + 1));
    btnPrevStep.addEventListener('click', () => goTo(current - 1));
    btnNextStep.addEventListener('click', () => goTo(current + 1));
    btnSubmit.addEventListener('click', () => alert('提交成功！'));

    document.addEventListener('keydown', e => {
      if (document.activeElement && document.activeElement.id === 'custom-input') return;
      const q = questions[current];
      if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo(current - 1); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); return; }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        focusedIndex = focusedIndex <= 0 ? q.choices.length - 1 : focusedIndex - 1;
        render();
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        focusedIndex = focusedIndex >= q.choices.length - 1 ? 0 : focusedIndex + 1;
        render();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        // 焦点在 placeholder 选项时，优先进入编辑态，不触发提交
        const focusedChoice = q.choices[focusedIndex];
        if (focusedChoice && focusedChoice.placeholder) {
          const alreadyFilled = selections[current] === focusedChoice.key && customAnswers[current].trim();
          if (!alreadyFilled) {
            selectChoice(focusedChoice.key);
            return;
          }
        }
        const isLast = current === questions.length - 1;
        if (isLast && selections[current] !== null) {
          const selChoice = q.choices.find(c => c.key === selections[current]);
          const isCustom = selChoice && selChoice.placeholder;
          if (!isCustom || customAnswers[current].trim()) {
            alert('提交成功！');
            return;
          }
        }
        if (focusedIndex >= 0) {
          selectChoice(q.choices[focusedIndex].key);
        }
        return;
      }
      const letter = e.key.toUpperCase();
      const match = q.choices.find(c => c.key === letter);
      if (match) selectChoice(match.key);
    });

    render();
  </script>

</body>
</html>
